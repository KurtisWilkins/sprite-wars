<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Wars &#8212; Sprite Part Editor</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-dark: #1a1a2e;
            --bg-panel: #16213e;
            --bg-input: #0f3460;
            --accent: #e94560;
            --accent2: #0ea5e9;
            --text: #e0e0e0;
            --text-dim: #8899aa;
            --border: #2a2a4a;
            --sidebar-w: 320px;
        }
        body { background: var(--bg-dark); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 14px; overflow: hidden; height: 100vh; }
        .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr var(--sidebar-w); grid-template-rows: 48px 1fr 56px; height: 100vh; }
        .toolbar { grid-column: 1 / -1; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 8px; }
        .toolbar h1 { font-size: 16px; font-weight: 600; color: var(--accent); margin-right: 12px; white-space: nowrap; }
        .toolbar select, .toolbar button, .toolbar input { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; font-size: 13px; cursor: pointer; }
        .toolbar button:hover { background: var(--accent); }
        .toolbar .spacer { flex: 1; }
        .toolbar a { color: var(--text-dim); text-decoration: none; font-size: 12px; }
        .toolbar a:hover { color: var(--text); }
        .sidebar-left { grid-row: 2; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-left h2, .sidebar-right h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; padding: 8px 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .parts-list { flex: 1; overflow-y: auto; padding: 4px; }
        .part-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; user-select: none; }
        .part-item:hover { background: rgba(255,255,255,0.05); }
        .part-item.selected { border-color: var(--accent); background: rgba(233,69,96,0.1); }
        .part-item .drag-handle { cursor: grab; color: var(--text-dim); font-size: 16px; flex-shrink: 0; }
        .part-item .part-thumb { width: 32px; height: 32px; background: var(--bg-dark); border-radius: 3px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .part-item .part-thumb img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
        .part-item .part-name { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .part-item .part-vis { cursor: pointer; color: var(--text-dim); font-size: 14px; flex-shrink: 0; }
        .part-item .part-vis.hidden-part { opacity: 0.3; }
        .canvas-area { grid-row: 2; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        #main-canvas { image-rendering: pixelated; cursor: crosshair; }
        .canvas-info { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 4px 12px; border-radius: 4px; font-size: 11px; color: var(--text-dim); }
        .canvas-controls { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 4px; }
        .canvas-controls button { background: var(--bg-panel); color: var(--text); border: 1px solid var(--border); padding: 4px 8px; border-radius: 3px; font-size: 11px; cursor: pointer; }
        .canvas-controls button:hover { background: var(--accent); }
        .canvas-controls button.active { background: var(--accent2); }
        .sidebar-right { grid-row: 2; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .tab-bar { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tab-bar button { flex: 1; background: none; border: none; color: var(--text-dim); padding: 8px 4px; font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.5px; }
        .tab-bar button:hover { color: var(--text); }
        .tab-bar button.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-content { flex: 1; overflow-y: auto; padding: 8px 12px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .prop-group { margin-bottom: 16px; }
        .prop-group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent2); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
        .prop-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .prop-row label { width: 80px; font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
        .prop-row input[type="number"] { width: 60px; background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 3px 6px; border-radius: 3px; font-size: 12px; }
        .prop-row input[type="range"] { flex: 1; accent-color: var(--accent); }
        .prop-row .range-val { width: 40px; text-align: right; font-size: 11px; color: var(--text-dim); }
        .prop-row select { flex: 1; background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 3px 6px; border-radius: 3px; font-size: 12px; }
        .no-selection { color: var(--text-dim); font-style: italic; padding: 20px; text-align: center; }
        .mapping-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; padding: 4px 6px; background: var(--bg-dark); border-radius: 4px; }
        .mapping-row .slot-label { width: 80px; font-size: 11px; color: var(--text-dim); flex-shrink: 0; text-transform: capitalize; }
        .mapping-row select { flex: 1; background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 3px 6px; border-radius: 3px; font-size: 11px; }
        .mapping-row .reset-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; padding: 2px; }
        .mapping-row .reset-btn:hover { color: var(--accent); }
        .equip-slot { margin-bottom: 10px; padding: 6px 8px; background: var(--bg-dark); border-radius: 4px; }
        .equip-slot h4 { font-size: 11px; color: var(--accent2); margin-bottom: 4px; text-transform: uppercase; }
        .equip-slot select { width: 100%; background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 4px 6px; border-radius: 3px; font-size: 12px; margin-bottom: 4px; }
        .equip-offset { display: flex; gap: 6px; align-items: center; }
        .equip-offset label { font-size: 10px; color: var(--text-dim); }
        .equip-offset input { width: 45px; background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 2px 4px; border-radius: 3px; font-size: 11px; }
        .color-preview { display: inline-block; width: 14px; height: 14px; border-radius: 2px; border: 1px solid var(--border); vertical-align: middle; margin-left: 4px; }
        .statusbar { grid-column: 1 / -1; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 12px; font-size: 12px; color: var(--text-dim); }
        .statusbar .status-section { display: flex; align-items: center; gap: 6px; }
        .statusbar button { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 2px 10px; border-radius: 3px; font-size: 12px; cursor: pointer; }
        .statusbar button:hover { background: var(--accent); }
        .statusbar select { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 2px 6px; border-radius: 3px; font-size: 12px; }
        .statusbar .spacer { flex: 1; }
        .statusbar label { font-size: 12px; }
        .statusbar input[type="range"] { width: 80px; accent-color: var(--accent); }
        .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--accent2); color: #fff; padding: 8px 20px; border-radius: 4px; font-size: 13px; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
        .drop-indicator { height: 2px; background: var(--accent); margin: 0 4px; }
        @media (max-width: 900px) {
            .app { grid-template-columns: 1fr; grid-template-rows: 48px auto 300px 56px; }
            .sidebar-left { grid-row: 3; border-right: none; border-top: 1px solid var(--border); }
            .sidebar-right { display: none; }
            .canvas-area { grid-row: 2; }
            .statusbar { grid-row: 4; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="toolbar">
        <h1>Sprite Part Editor</h1>
        <label>Race:</label>
        <select id="race-select"></select>
        <label>Stage:</label>
        <select id="stage-select">
            <option value="1">Stage 1</option>
            <option value="2">Stage 2</option>
            <option value="3">Stage 3</option>
        </select>
        <button id="btn-load" title="Load skeleton from server">Load</button>
        <button id="btn-save" title="Save skeleton + config to server">Save</button>
        <button id="btn-export" title="Download skeleton.json">Export</button>
        <button id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
        <span class="spacer"></span>
        <label><input type="checkbox" id="chk-bones" checked> Bones</label>
        <label><input type="checkbox" id="chk-anchors" checked> Anchors</label>
        <span class="spacer"></span>
        <a href="index.html">Game</a>
        <a href="tile-admin.html">Tiles</a>
    </div>
    <div class="sidebar-left">
        <h2>Parts / Draw Order</h2>
        <div class="parts-list" id="parts-list">
            <div class="no-selection">Select a race and stage, then click Load.</div>
        </div>
    </div>
    <div class="canvas-area">
        <canvas id="main-canvas" width="512" height="512"></canvas>
        <div class="canvas-controls">
            <button id="btn-grid" title="Toggle grid">Grid</button>
            <button id="btn-crosshair" title="Toggle crosshair">Cross</button>
            <button id="btn-onion" title="Toggle onion skinning">Onion</button>
            <button id="btn-zoom-in" title="Zoom in">+</button>
            <button id="btn-zoom-out" title="Zoom out">-</button>
            <span id="zoom-label" style="font-size:10px;color:var(--text-dim);text-align:center;">4x</span>
        </div>
        <div class="canvas-info" id="canvas-info">No data loaded</div>
    </div>
    <div class="sidebar-right">
        <div class="tab-bar">
            <button class="active" data-tab="props-tab">Properties</button>
            <button data-tab="equip-tab">Equipment</button>
            <button data-tab="mapping-tab">Mapping</button>
        </div>
        <div class="tab-content">
            <div class="tab-panel active" id="props-tab">
                <div id="props-panel">
                    <div class="no-selection">Select a part to edit.</div>
                </div>
            </div>
            <div class="tab-panel" id="equip-tab">
                <div id="equip-panel"></div>
            </div>
            <div class="tab-panel" id="mapping-tab">
                <div id="mapping-panel"></div>
            </div>
        </div>
    </div>
    <div class="statusbar">
        <div class="status-section">
            <button id="btn-play">Play</button>
            <button id="btn-stop">Stop</button>
            <button id="btn-step-back" title="Previous frame">|&lt;</button>
            <button id="btn-step-fwd" title="Next frame">&gt;|</button>
        </div>
        <div class="status-section">
            <label>Anim:</label>
            <select id="anim-select">
                <option value="walk">Walk</option>
                <option value="idle">Idle</option>
                <option value="attack">Attack</option>
                <option value="hit">Hit</option>
                <option value="death">Death</option>
            </select>
        </div>
        <div class="status-section">
            <label>Dir:</label>
            <select id="dir-select">
                <option value="down">Down</option>
                <option value="left">Left</option>
                <option value="right">Right</option>
                <option value="up">Up</option>
            </select>
        </div>
        <div class="status-section">
            <label>Speed:</label>
            <input type="range" id="speed-slider" min="0.1" max="3" step="0.1" value="1" style="width:80px">
            <span id="speed-val">1.0x</span>
        </div>
        <div class="status-section">
            <label><input type="checkbox" id="chk-loop" checked> Loop</label>
        </div>
        <div class="status-section">
            <span id="frame-info">Frame: 0/4</span>
        </div>
        <span class="spacer"></span>
        <span id="status-msg">Ready</span>
    </div>
</div>
<div class="toast" id="toast"></div>

// Undo system
const undoStack = [];
const MAX_UNDO = 20;

function pushUndo(description) {
    undoStack.push({
        desc: description,
        parts: JSON.parse(JSON.stringify(state.parts)),
        partMapping: JSON.parse(JSON.stringify(state.partMapping)),
        equipment: JSON.parse(JSON.stringify(state.equipment)),
        equipmentOffsets: JSON.parse(JSON.stringify(state.equipmentOffsets)),
        drawOrder: JSON.parse(JSON.stringify(state.drawOrder)),
    });
    if (undoStack.length > MAX_UNDO) undoStack.shift();
}

function popUndo() {
    if (undoStack.length === 0) { toast('Nothing to undo'); return; }
    var snap = undoStack.pop();
    state.parts = snap.parts;
    state.partMapping = snap.partMapping;
    state.equipment = snap.equipment;
    state.equipmentOffsets = snap.equipmentOffsets;
    state.drawOrder = snap.drawOrder;
    rebuildPartsList();
    updatePropsPanel();
    updateMappingPanel();
    updateEquipPanel();
    render();
    toast('Undo: ' + snap.desc);
}

// Toast
var toastTimeout;
function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');

    toastTimeout = setTimeout(function() { toastEl.classList.remove('show'); }, 2500);
}

// Tab Switching
function switchTab(tabId) {
    document.querySelectorAll('.tab-bar button').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.tab === tabId);
    });
    document.querySelectorAll('.tab-panel').forEach(function(panel) {
        panel.classList.toggle('active', panel.id === tabId);
    });
}

// Init
function init() {
    // Populate race dropdown
    for (var id in RACES) {
        var opt = document.createElement('option');

    }

    for (var slotType in EQUIPMENT_ITEMS) {
        state.equipment[slotType] = 0;
        state.equipmentOffsets[slotType] = { x: 0, y: 0 };
    }

    // Events - toolbar
    $('btn-load').addEventListener('click', loadSkeleton);
    $('btn-save').addEventListener('click', saveSkeleton);
    $('btn-export').addEventListener('click', exportSkeleton);
    $('btn-undo').addEventListener('click', popUndo);
    raceSelect.addEventListener('change', function() { state.race = raceSelect.value; });
    stageSelect.addEventListener('change', function() { state.stage = parseInt(stageSelect.value); });
    $('chk-bones').addEventListener('change', render);
    $('chk-anchors').addEventListener('change', render);

    // Events - status bar
    $('btn-play').addEventListener('click', togglePlay);
    $('btn-stop').addEventListener('click', stopPlay);
    $('btn-step-back').addEventListener('click', function() { stepFrame(-1); });
    $('btn-step-fwd').addEventListener('click', function() { stepFrame(1); });
    animSelect.addEventListener('change', function() { state.animType = animSelect.value; state.animFrame = 0; state.animTime = 0; render(); });
    dirSelect.addEventListener('change', function() { state.direction = dirSelect.value; rebuildPartsList(); render(); });
    speedSlider.addEventListener('input', function() { state.speed = parseFloat(speedSlider.value); speedVal.textContent = state.speed.toFixed(1) + 'x'; });
    $('chk-loop').addEventListener('change', function() { state.loop = $('chk-loop').checked; });

    $('btn-grid').addEventListener('click', function() { state.showGrid = !state.showGrid; $('btn-grid').classList.toggle('active', state.showGrid); render(); });
    $('btn-crosshair').addEventListener('click', function() { state.showCrosshair = !state.showCrosshair; $('btn-crosshair').classList.toggle('active', state.showCrosshair); render(); });
    $('btn-onion').addEventListener('click', function() { state.showOnion = !state.showOnion; $('btn-onion').classList.toggle('active', state.showOnion); render(); });
    $('btn-zoom-in').addEventListener('click', function() { setZoom(state.zoom * 2); });
    $('btn-zoom-out').addEventListener('click', function() { setZoom(state.zoom / 2); });

    // Events - tab switching
    document.querySelectorAll('.tab-bar button').forEach(function(btn) {
        btn.addEventListener('click', function() { switchTab(btn.dataset.tab); });
    });

    // Canvas mouse events
    canvas.addEventListener('mousedown', onCanvasMouseDown);
    canvas.addEventListener('mousemove', onCanvasMouseMove);
    canvas.addEventListener('mouseup', onCanvasMouseUp);
    canvas.addEventListener('mouseleave', onCanvasMouseUp);

    // Keyboard shortcuts
    document.addEventListener('keydown', onKeyDown);

    // Build initial panels
    updateEquipPanel();

    // Start render loop

}

// Zoom
function setZoom(z) {
    z = Math.max(1, Math.min(8, z));
    state.zoom = z;
    $('zoom-label').textContent = z + 'x';
    render();
}

// Keyboard Shortcuts
function onKeyDown(e) {
    if (e.ctrlKey && e.key === 'z') {
        e.preventDefault();
        popUndo();
        return;
    }
    if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
        saveSkeleton();
        return;
    }
    if (e.key === ' ' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
        e.preventDefault();
        togglePlay();
        return;
    }
    if (e.key === 'ArrowLeft' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        stepFrame(-1);
        return;
    }
    if (e.key === 'ArrowRight' && e.target.tagName !== 'INPUT') {
        e.preventDefault();
        stepFrame(1);
        return;
    }
    if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
        if (e.key === '1') { setZoom(1); return; }
        if (e.key === '2') { setZoom(2); return; }
        if (e.key === '3') { setZoom(4); return; }
        if (e.key === '4') { setZoom(8); return; }
    }
}

// Load Skeleton
async function loadSkeleton() {
    var race = state.race;
    var stage = state.stage;
    statusMsg.textContent = 'Loading ' + race + ' S' + stage + '...';

    state.parts = {};
    state.images = {};
    state.selectedPart = null;
    state.skeletonData = null;
    state.partMapping = {};

    var skelUrl = '../Sprites/Characters/' + race + '/parts/' + race + '_S' + stage + '_skeleton.json';
    var skelData = null;
    try {
        var resp = await fetch(skelUrl);
        if (resp.ok) {
            var text = await resp.text();
            try {
                skelData = JSON.parse(text);
                state.skeletonData = skelData;
            } catch (parseErr) {
                toast('Warning: skeleton JSON is corrupt, using defaults');
                console.error('[Load] Skeleton JSON parse error:', parseErr.message, '| Raw:', text.substring(0, 100));
            }
        }
    } catch (e) { console.warn('[Load] Skeleton fetch:', e.message); }

    // Try loading editor config
    try {
        var cfgResp = await fetch('/api/editor-config/load?race=' + encodeURIComponent(race) + '&stage=' + stage);
        if (cfgResp.ok) {
            var cfgText = await cfgResp.text();
            var cfg = JSON.parse(cfgText);
            if (cfg && cfg.config) {
                if (cfg.config.part_mapping) state.partMapping = cfg.config.part_mapping;
                if (cfg.config.partMapping) state.partMapping = cfg.config.partMapping;
                if (cfg.config.equipment_loadout) state.equipment = cfg.config.equipment_loadout;
                if (cfg.config.equipment) state.equipment = cfg.config.equipment;
                if (cfg.config.equipment_offsets) state.equipmentOffsets = cfg.config.equipment_offsets;
                if (cfg.config.equipmentOffsets) state.equipmentOffsets = cfg.config.equipmentOffsets;
                if (cfg.config.bone_hierarchy) {
                    for (var bone in cfg.config.bone_hierarchy) {
                        BONE_HIERARCHY[bone] = cfg.config.bone_hierarchy[bone];
                    }
                }
            }
        }
    } catch (e) { console.warn('[Load] Config:', e.message); }

    // Ensure equipment state initialized
    for (var st in EQUIPMENT_ITEMS) {
        if (state.equipment[st] === undefined) state.equipment[st] = 0;
        if (!state.equipmentOffsets[st]) state.equipmentOffsets[st] = { x: 0, y: 0 };
    }

    // Initialize draw order
    state.drawOrder = {};
    var dirs = ['down','up','left','right'];
    for (var di = 0; di < dirs.length; di++) {
        var dir = dirs[di];
        if (skelData && skelData.draw_order && Array.isArray(skelData.draw_order)) {
            state.drawOrder[dir] = skelData.draw_order.slice();
        } else {
            state.drawOrder[dir] = DEFAULT_DRAW_ORDER[dir].slice();
        }
    }

    // Load part images
    var loadPromises = [];
    for (var pi = 0; pi < BODY_PARTS.length; pi++) {
        var part = BODY_PARTS[pi];
        (function(part) {
            var imgUrl = '../Sprites/Characters/' + race + '/parts/' + race + '_S' + stage + '_' + part + '.png';
            var img = new Image();
            var p = new Promise(function(resolve) {
                img.onload = function() {
                    state.images[part] = img;
                    var anchor = (skelData && skelData.parts && skelData.parts[part])
                        ? { x: skelData.parts[part].anchor.x, y: skelData.parts[part].anchor.y }
                        : { x: DEFAULT_ANCHORS[part].x, y: DEFAULT_ANCHORS[part].y };
                    var rotation = (skelData && skelData.bones && skelData.bones[part])
                        ? (skelData.bones[part].rotation || 0)
                        : (skelData && skelData.parts && skelData.parts[part])
                            ? (skelData.parts[part].rotation || 0)
                            : 0;
                    state.parts[part] = { anchor: anchor, rotation: rotation, visible: true };
                    resolve(true);
                };
                img.onerror = function() { resolve(false); };
            });
            img.src = imgUrl;
            loadPromises.push(p);
        })(part);
    }

    var results = await Promise.all(loadPromises);
    var loadedCount = results.filter(Boolean).length;

    // Fix draw order
    for (var di2 = 0; di2 < dirs.length; di2++) {
        var d = dirs[di2];
        state.drawOrder[d] = state.drawOrder[d].filter(function(p) { return state.images[p]; });
        for (var pi2 = 0; pi2 < BODY_PARTS.length; pi2++) {
            var bp = BODY_PARTS[pi2];
            if (state.images[bp] && state.drawOrder[d].indexOf(bp) === -1) {
                state.drawOrder[d].push(bp);
            }
        }
    }

    rebuildPartsList();
    updatePropsPanel();
    updateMappingPanel();
    updateEquipPanel();
    canvasInfo.textContent = race + ' Stage ' + stage + ' \u2014 ' + loadedCount + ' parts loaded';
    statusMsg.textContent = 'Loaded ' + loadedCount + ' parts';
    toast('Loaded ' + race + ' S' + stage + ': ' + loadedCount + ' parts');
    render();
}

// Save Skeleton
async function saveSkeleton() {
    var data = buildSkeletonJson();
    statusMsg.textContent = 'Saving...';
    console.log('[Save] Building skeleton JSON for', state.race, 'S' + state.stage);

    // Validate JSON before sending
    var bodyStr;
    try {
        bodyStr = JSON.stringify({ race: state.race, stage: state.stage, data: data });
        JSON.parse(bodyStr); // round-trip validation
        console.log('[Save] JSON validation passed, payload size:', bodyStr.length, 'bytes');
    } catch (jsonErr) {
        var errMsg = 'Save aborted: invalid JSON — ' + jsonErr.message;
        toast(errMsg);
        statusMsg.textContent = 'Save error (bad JSON)';
        console.error('[Save] JSON validation FAILED:', jsonErr);
        console.error('[Save] Raw data:', JSON.stringify(data, function(k, v) { return typeof v === 'number' && !isFinite(v) ? '***NaN/Inf***' : v; }, 2));
        return;
    }

    // Save skeleton
    try {
        var skelResp = await fetch('/api/skeleton/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: bodyStr
        });
        var respText = await skelResp.text();
        console.log('[Save] Skeleton response:', skelResp.status, respText.substring(0, 200));
        var skelResult;
        try {
            skelResult = JSON.parse(respText);
        } catch (parseErr) {
            toast('Save failed: server returned invalid response (HTTP ' + skelResp.status + '): ' + respText.substring(0, 100));
            statusMsg.textContent = 'Save failed';
            console.error('[Save] Response parse error:', parseErr, 'Raw:', respText);
            return;
        }
        if (!skelResult.success) {
            toast('Skeleton save failed: ' + (skelResult.error || 'Unknown'));
            statusMsg.textContent = 'Save failed';
            return;
        }
        console.log('[Save] Skeleton saved OK:', skelResult.file);
    } catch (e) {
        toast('Save network error: ' + e.message);
        statusMsg.textContent = 'Save error';
        console.error('[Save] Network error:', e);
        return;
    }

    // Save editor config
    try {
        var cfgBodyStr = JSON.stringify({
            race: state.race, stage: state.stage,
            config: {
                part_mapping: state.partMapping,
                equipment_loadout: state.equipment,
                equipment_offsets: state.equipmentOffsets,
                bone_hierarchy: Object.assign({}, BONE_HIERARCHY),
            }
        });
        var cfgResp = await fetch('/api/editor-config/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: cfgBodyStr
        });
        var cfgText = await cfgResp.text();
        console.log('[Save] Config response:', cfgResp.status, cfgText.substring(0, 200));
    } catch (cfgErr) {
        console.error('[Save] Config save error:', cfgErr);
    }

    toast('Skeleton + config saved successfully');
    statusMsg.textContent = 'Saved';
}

// Export Skeleton
function exportSkeleton() {
    var data = buildSkeletonJson();
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = state.race + '_S' + state.stage + '_skeleton.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Exported skeleton.json');
}

// Build Skeleton JSON
function buildSkeletonJson() {
    var origParts = (state.skeletonData && state.skeletonData.parts) || {};
    var parts = {};
    for (var name in state.parts) {
        var pd = state.parts[name];
        var orig = origParts[name] || {};
        var partEntry = {
            anchor: { x: pd.anchor.x, y: pd.anchor.y },
        };
        if (orig.file !== undefined) partEntry.file = orig.file;
        if (orig.width !== undefined) partEntry.width = orig.width;
        if (orig.height !== undefined) partEntry.height = orig.height;
        if (orig.source_bbox !== undefined) partEntry.source_bbox = orig.source_bbox;
        if (orig.source_center !== undefined) partEntry.source_center = orig.source_center;
        parts[name] = partEntry;
    }

    var source_size = (state.skeletonData && state.skeletonData.source_size) || 1;
    var bones = {};
    for (var bname in state.parts) {
        var bpd = state.parts[bname];
        var origBones = (state.skeletonData && state.skeletonData.bones) || {};
        var origBone = origBones[bname] || {};
        var parentName = BONE_HIERARCHY[bname] || null;
        var borig = origParts[bname] || {};

        var offset_x, offset_y;
        // source_center may be array [x,y] or object {x,y} — normalize
        var sc = borig.source_center;
        var scX = sc ? (Array.isArray(sc) ? sc[0] : sc.x) : undefined;
        var scY = sc ? (Array.isArray(sc) ? sc[1] : sc.y) : undefined;
        if (scX !== undefined && parentName === null) {
            offset_x = Math.round((scX / source_size) * 1000) / 1000;
            offset_y = Math.round((scY / source_size) * 1000) / 1000;
        } else if (scX !== undefined && parentName !== null) {
            var parentOrig = origParts[parentName] || {};
            var psc = parentOrig.source_center;
            var pscX = psc ? (Array.isArray(psc) ? psc[0] : psc.x) : undefined;
            var pscY = psc ? (Array.isArray(psc) ? psc[1] : psc.y) : undefined;
            if (pscX !== undefined) {
                offset_x = Math.round(((scX / source_size) - (pscX / source_size)) * 1000) / 1000;
                offset_y = Math.round(((scY / source_size) - (pscY / source_size)) * 1000) / 1000;
            } else {
                offset_x = origBone.offset_x !== undefined ? origBone.offset_x : (PARENT_ATTACH[bname] ? PARENT_ATTACH[bname].x : 0);
                offset_y = origBone.offset_y !== undefined ? origBone.offset_y : (PARENT_ATTACH[bname] ? PARENT_ATTACH[bname].y : 0);
            }
        } else {
            offset_x = origBone.offset_x !== undefined ? origBone.offset_x : (PARENT_ATTACH[bname] ? PARENT_ATTACH[bname].x : 0);
            offset_y = origBone.offset_y !== undefined ? origBone.offset_y : (PARENT_ATTACH[bname] ? PARENT_ATTACH[bname].y : 0);
        }
        // Guard against NaN from malformed data
        if (!isFinite(offset_x)) offset_x = 0;
        if (!isFinite(offset_y)) offset_y = 0;

        bones[bname] = {
            parent: parentName,
            offset_x: offset_x,
            offset_y: offset_y,
            rotation: bpd.rotation,
            scale: origBone.scale !== undefined ? origBone.scale : 1.0,
        };
    }

    var draw_order = state.drawOrder[state.direction] || state.drawOrder['down'] || [];

    var result = {
        race: state.race,
        stage: state.stage,
    };
    if (state.skeletonData && state.skeletonData.source_size !== undefined) {
        result.source_size = state.skeletonData.source_size;
    }
    result.parts = parts;
    result.bones = bones;
    result.draw_order = draw_order;
    return result;
}

// Parts List (Left Sidebar)
function rebuildPartsList() {
    partsList.innerHTML = '';
    var order = state.drawOrder[state.direction] || [];

    for (var i = 0; i < order.length; i++) {
        (function(partName, index) {
            if (!state.images[partName]) return;
            var pd = state.parts[partName];
            if (!pd) return;

            var item = document.createElement('div');
            item.className = 'part-item' + (state.selectedPart === partName ? ' selected' : '');
            item.dataset.part = partName;
            item.draggable = true;

            var handle = document.createElement('span');
            handle.className = 'drag-handle';
            handle.textContent = '\u2630';

            var thumb = document.createElement('div');
            thumb.className = 'part-thumb';
            var thumbImg = document.createElement('img');
            var mappedPart = state.partMapping[partName] || partName;
            var mappedImg = state.images[mappedPart] || state.images[partName];
            if (mappedImg) thumbImg.src = mappedImg.src;
            thumb.appendChild(thumbImg);

            var nameEl = document.createElement('span');
            nameEl.className = 'part-name';
            var displayName = partName.replace(/_/g, ' ');
            if (state.partMapping[partName] && state.partMapping[partName] !== partName) {
                displayName += ' \u2190 ' + state.partMapping[partName].replace(/_/g, ' ');
            }
            nameEl.textContent = displayName;

            var vis = document.createElement('span');
            vis.className = 'part-vis' + (pd.visible ? '' : ' hidden-part');
            vis.textContent = pd.visible ? '\u25C9' : '\u25CE';
            vis.title = 'Toggle visibility';
            vis.addEventListener('click', function(e) {
                e.stopPropagation();
                pd.visible = !pd.visible;
                rebuildPartsList();
                render();
            });

            item.appendChild(handle);
            item.appendChild(thumb);
            item.appendChild(nameEl);
            item.appendChild(vis);

            item.addEventListener('click', function() {
                state.selectedPart = partName;
                rebuildPartsList();
                updatePropsPanel();
                render();
            });

            item.addEventListener('dragstart', function(e) {
                e.dataTransfer.setData('text/plain', partName);
                item.style.opacity = '0.4';
            });
            item.addEventListener('dragend', function() {
                item.style.opacity = '1';
                document.querySelectorAll('.drop-indicator').forEach(function(el) { el.remove(); });
            });
            item.addEventListener('dragover', function(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            });
            item.addEventListener('drop', function(e) {
                e.preventDefault();
                var draggedPart = e.dataTransfer.getData('text/plain');
                if (draggedPart === partName) return;
                pushUndo('reorder parts');
                var ord = state.drawOrder[state.direction];
                var fromIdx = ord.indexOf(draggedPart);
                var toIdx = ord.indexOf(partName);
                if (fromIdx < 0 || toIdx < 0) return;
                ord.splice(fromIdx, 1);
                ord.splice(toIdx, 0, draggedPart);
                rebuildPartsList();
                render();
            });

            partsList.appendChild(item);
        })(order[i], i);
    }
}

// Properties Panel (Props Tab)
function updatePropsPanel() {
    var part = state.selectedPart;
    if (!part || !state.parts[part]) {
        propsPanel.innerHTML = '<div class="no-selection">Select a part to edit.</div>';
        return;
    }

    var pd = state.parts[part];
    var drawIdx = (state.drawOrder[state.direction] || []).indexOf(part);
    var maxIdx = (state.drawOrder[state.direction] || []).length - 1;

    propsPanel.innerHTML = '<div class="prop-group">' +
        '<h3>' + part.replace(/_/g, ' ') + '</h3>' +
        '<div class="prop-row"><label>Anchor X:</label><input type="number" id="prop-ax" value="' + pd.anchor.x + '" step="1"></div>' +
        '<div class="prop-row"><label>Anchor Y:</label><input type="number" id="prop-ay" value="' + pd.anchor.y + '" step="1"></div>' +
        '</div>' +
        '<div class="prop-group">' +
        '<h3>Bone Rotation</h3>' +
        '<div class="prop-row"><label>Default:</label><input type="range" id="prop-rot" min="-180" max="180" step="1" value="' + pd.rotation + '"><span class="range-val" id="prop-rot-val">' + pd.rotation + '\u00B0</span></div>' +
        '</div>' +
        '<div class="prop-group">' +
        '<h3>Hierarchy</h3>' +
        '<div class="prop-row"><label>Parent:</label><span style="color:var(--text-dim)">' + (BONE_HIERARCHY[part] || '(root)') + '</span></div>' +
        '<div class="prop-row"><label>Attach X:</label><input type="number" id="prop-pax" value="' + (PARENT_ATTACH[part] || {x:0}).x + '" step="1"></div>' +
        '<div class="prop-row"><label>Attach Y:</label><input type="number" id="prop-pay" value="' + (PARENT_ATTACH[part] || {y:0}).y + '" step="1"></div>' +
        '</div>' +
        '<div class="prop-group">' +
        '<h3>Draw Order</h3>' +
        '<div class="prop-row"><label>Direction:</label><span style="color:var(--text-dim)">' + state.direction + '</span></div>' +
        '<div class="prop-row"><label>Index:</label><input type="number" id="prop-draworder" value="' + drawIdx + '" min="0" max="' + maxIdx + '" step="1"></div>' +
        '</div>';

    $('prop-ax').addEventListener('change', function(e) {
        pushUndo('anchor X');
        pd.anchor.x = parseInt(e.target.value) || 0;
        render();
    });
    $('prop-ay').addEventListener('change', function(e) {
        pushUndo('anchor Y');
        pd.anchor.y = parseInt(e.target.value) || 0;
        render();
    });
    $('prop-rot').addEventListener('input', function(e) {
        pd.rotation = parseInt(e.target.value) || 0;
        $('prop-rot-val').textContent = pd.rotation + '\u00B0';
        render();
    });
    $('prop-rot').addEventListener('change', function() {
        pushUndo('rotation');
    });
    $('prop-pax').addEventListener('change', function(e) {
        pushUndo('attach offset X');
        if (!PARENT_ATTACH[part]) PARENT_ATTACH[part] = { x: 0, y: 0 };
        PARENT_ATTACH[part].x = parseInt(e.target.value) || 0;
        render();
    });
    $('prop-pay').addEventListener('change', function(e) {
        pushUndo('attach offset Y');
        if (!PARENT_ATTACH[part]) PARENT_ATTACH[part] = { x: 0, y: 0 };
        PARENT_ATTACH[part].y = parseInt(e.target.value) || 0;
        render();
    });
    $('prop-draworder').addEventListener('change', function(e) {
        pushUndo('draw order');
        var newIdx = parseInt(e.target.value) || 0;
        var ord = state.drawOrder[state.direction];
        var curIdx = ord.indexOf(part);
        if (curIdx < 0 || newIdx === curIdx) return;
        ord.splice(curIdx, 1);
        var clampIdx = Math.max(0, Math.min(ord.length, newIdx));
        ord.splice(clampIdx, 0, part);
        rebuildPartsList();
        render();
    });
}

// Equipment Panel (Equip Tab)
function updateEquipPanel() {
    var html = '<div class="prop-group"><h3>Equipment Slots</h3></div>';

    for (var slotType in EQUIPMENT_ITEMS) {
        var items = EQUIPMENT_ITEMS[slotType];
        var currentId = state.equipment[slotType] || 0;
        var currentItem = items.find(function(it) { return it.id === currentId; });
        var offset = state.equipmentOffsets[slotType] || { x: 0, y: 0 };

        html += '<div class="equip-slot"><h4>' + slotType;
        if (currentItem && currentItem.color) {
            html += ' <span class="color-preview" style="background:' + currentItem.color + '"></span>';
        }
        html += '</h4><select data-slot="' + slotType + '">';
        for (var ii = 0; ii < items.length; ii++) {
            html += '<option value="' + items[ii].id + '"' + (items[ii].id === currentId ? ' selected' : '') + '>' + items[ii].name + '</option>';
        }
        html += '</select>' +
            '<div class="equip-offset">' +
            '<label>X:</label><input type="number" data-slot-offset-x="' + slotType + '" value="' + offset.x + '" step="1">' +
            '<label>Y:</label><input type="number" data-slot-offset-y="' + slotType + '" value="' + offset.y + '" step="1">' +
            '</div></div>';
    }

    equipPanel.innerHTML = html;

    equipPanel.querySelectorAll('select[data-slot]').forEach(function(sel) {
        sel.addEventListener('change', function(e) {
            pushUndo('equip ' + sel.dataset.slot);
            state.equipment[sel.dataset.slot] = parseInt(e.target.value);
            updateEquipPanel();
            render();
        });
    });
    equipPanel.querySelectorAll('input[data-slot-offset-x]').forEach(function(inp) {
        inp.addEventListener('change', function(e) {
            pushUndo('equip offset');
            var slot = inp.dataset.slotOffsetX;
            if (!state.equipmentOffsets[slot]) state.equipmentOffsets[slot] = { x: 0, y: 0 };
            state.equipmentOffsets[slot].x = parseInt(e.target.value) || 0;
            render();
        });
    });
    equipPanel.querySelectorAll('input[data-slot-offset-y]').forEach(function(inp) {
        inp.addEventListener('change', function(e) {
            pushUndo('equip offset');
            var slot = inp.dataset.slotOffsetY;
            if (!state.equipmentOffsets[slot]) state.equipmentOffsets[slot] = { x: 0, y: 0 };
            state.equipmentOffsets[slot].y = parseInt(e.target.value) || 0;
            render();
        });
    });
}

// Mapping Panel (Mapping Tab)
function updateMappingPanel() {
    var loadedParts = Object.keys(state.images);
    if (loadedParts.length === 0) {
        mappingPanel.innerHTML = '<div class="no-selection">Load a skeleton first.</div>';
        return;
    }

    var html = '<div class="prop-group"><h3>Texture Mapping</h3>' +
        '<div style="font-size:11px;color:var(--text-dim);margin-bottom:10px;">Reassign which texture is used for each body part slot.</div></div>';

    for (var bi = 0; bi < BODY_PARTS.length; bi++) {
        var part = BODY_PARTS[bi];
        if (!state.images[part] && !state.partMapping[part]) continue;
        var currentSource = state.partMapping[part] || part;

        html += '<div class="mapping-row">' +
            '<span class="slot-label">' + part.replace(/_/g, ' ') + '</span>' +
            '<select data-mapping-slot="' + part + '">';
        for (var si = 0; si < BODY_PARTS.length; si++) {
            var srcPart = BODY_PARTS[si];
            if (!state.images[srcPart]) continue;
            html += '<option value="' + srcPart + '"' + (srcPart === currentSource ? ' selected' : '') + '>' + srcPart.replace(/_/g, ' ') + '</option>';
        }
        html += '</select>' +
            '<button class="reset-btn" data-mapping-reset="' + part + '" title="Reset to default">\u21BA</button>' +
            '</div>';
    }

    // Copy Body From
    html += '<div class="prop-group" style="margin-top:16px;"><h3>Copy Body From</h3>' +
        '<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">Load another race\'s body images (except head).</div>' +
        '<select id="copy-body-select" style="width:100%;background:var(--bg-input);color:var(--text);border:1px solid var(--border);padding:4px 6px;border-radius:3px;font-size:12px;">' +
        '<option value="">-- Select Source Race --</option>';
    for (var rid in RACES) {
        if (RACES[rid] !== state.race) {
            html += '<option value="' + RACES[rid] + '">' + rid + '. ' + RACES[rid] + '</option>';
        }
    }
    html += '</select></div>';

    mappingPanel.innerHTML = html;

    mappingPanel.querySelectorAll('select[data-mapping-slot]').forEach(function(sel) {
        sel.addEventListener('change', function(e) {
            var slotName = sel.dataset.mappingSlot;
            var newSource = e.target.value;
            pushUndo('remap ' + slotName);
            if (newSource === slotName) {
                delete state.partMapping[slotName];
            } else {
                state.partMapping[slotName] = newSource;
            }
            rebuildPartsList();
            render();
        });
    });

    mappingPanel.querySelectorAll('button[data-mapping-reset]').forEach(function(btn) {
        btn.addEventListener('click', function() {
            var slotName = btn.dataset.mappingReset;
            pushUndo('reset mapping ' + slotName);
            delete state.partMapping[slotName];
            updateMappingPanel();
            rebuildPartsList();
            render();
        });
    });

    var copySelect = $('copy-body-select');
    if (copySelect) {
        copySelect.addEventListener('change', function(e) {
            if (e.target.value) {
                copyBodyFrom(e.target.value);
                e.target.value = '';
            }
        });
    }
}

// Copy Body From
async function copyBodyFrom(sourceRace) {
    pushUndo('copy body from ' + sourceRace);
    statusMsg.textContent = 'Copying body from ' + sourceRace + '...';

    var nonHeadParts = BODY_PARTS.filter(function(p) { return p !== 'head' && p !== 'accessory'; });
    var loadPromises = [];

    for (var i = 0; i < nonHeadParts.length; i++) {
        (function(part) {
            var imgUrl = '../Sprites/Characters/' + sourceRace + '/parts/' + sourceRace + '_S' + state.stage + '_' + part + '.png';
            var img = new Image();
            var p = new Promise(function(resolve) {
                img.onload = function() {
                    state.images[part] = img;
                    resolve(true);
                };
                img.onerror = function() { resolve(false); };
            });
            img.src = imgUrl;
            loadPromises.push(p);
        })(nonHeadParts[i]);
    }

    var results = await Promise.all(loadPromises);
    var loaded = results.filter(Boolean).length;

    rebuildPartsList();
    updateMappingPanel();
    render();
    toast('Copied ' + loaded + ' body parts from ' + sourceRace);
    statusMsg.textContent = 'Body copied from ' + sourceRace;
}

// Animation
function togglePlay() {
    state.playing = !state.playing;
    $('btn-play').textContent = state.playing ? 'Pause' : 'Play';
}

function stopPlay() {
    state.playing = false;
    state.animFrame = 0;
    state.animTime = 0;
    $('btn-play').textContent = 'Play';
    var kfs = getActiveKeyframes();
    frameInfo.textContent = 'Frame: 0/' + kfs.length;
    render();
}

function stepFrame(delta) {
    var kfs = getActiveKeyframes();
    state.animFrame = ((state.animFrame + delta) % kfs.length + kfs.length) % kfs.length;
    state.animTime = state.animFrame;
    frameInfo.textContent = 'Frame: ' + state.animFrame + '/' + kfs.length;
    render();
}

function getActiveKeyframes() {
    return ANIM_KEYFRAMES[state.animType] || ANIM_KEYFRAMES.walk;
}

var lastTime = 0;
function tick(time) {
    if (state.playing) {
        var dt = (time - lastTime) / 1000;
        var kfs = getActiveKeyframes();
        state.animTime += dt * state.speed * 4;

        if (!state.loop && state.animTime >= kfs.length) {
            state.animTime = kfs.length - 0.001;
            state.playing = false;
            $('btn-play').textContent = 'Play';
        }

        state.animFrame = Math.floor(state.animTime) % kfs.length;
        frameInfo.textContent = 'Frame: ' + state.animFrame + '/' + kfs.length;
        render();
    }
    lastTime = time;
    requestAnimationFrame(tick);
}

function getAnimatedTransform(partName) {
    var kfs = getActiveKeyframes();
    var frame = kfs[state.animFrame];
    var nextIdx = (state.animFrame + 1) % kfs.length;
    var nextFrame = kfs[nextIdx];
    var t = state.animTime % 1;
    var kf = frame ? frame[partName] : null;
    var nkf = nextFrame ? nextFrame[partName] : null;
    if (!kf) return { rot: 0, y: 0 };

    var rot = (kf.rot || 0) + ((nkf ? (nkf.rot || 0) : 0) - (kf.rot || 0)) * t;
    var y = (kf.y || 0) + ((nkf ? (nkf.y || 0) : 0) - (kf.y || 0)) * t;
    return { rot: rot, y: y };
}

// Canvas Interaction
var CHAR_CENTER_X = 256;
var CHAR_CENTER_Y = 256;

function getPartWorldPos(partName) {
    var pd = state.parts[partName];
    if (!pd) return { x: CHAR_CENTER_X, y: CHAR_CENTER_Y };

    var torsoAnim = state.playing ? getAnimatedTransform('torso') : { rot: 0, y: 0 };
    var ax = pd.anchor.x;
    var ay = pd.anchor.y;
    var S = state.zoom;
    var sx = CHAR_CENTER_X + (ax - 16) * S;
    var sy = CHAR_CENTER_Y - (ay - 16) * S - (torsoAnim.y || 0) * S;
    var anim = state.playing ? getAnimatedTransform(partName) : { rot: 0, y: 0 };

    return { x: sx, y: sy + (anim.y || 0) * S };
}

function onCanvasMouseDown(e) {
    var rect = canvas.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    var my = (e.clientY - rect.top) * (canvas.height / rect.height);
    var S = state.zoom;

    var order = state.drawOrder[state.direction] || [];
    // Check anchors
    for (var i = order.length - 1; i >= 0; i--) {
        var partName = order[i];
        var pd = state.parts[partName];
        if (!pd || !pd.visible) continue;
        var mappedPart = state.partMapping[partName] || partName;
        if (!state.images[mappedPart] && !state.images[partName]) continue;

        var pos = getPartWorldPos(partName);
        var dist = Math.sqrt(Math.pow(mx - pos.x, 2) + Math.pow(my - pos.y, 2));
        if (dist < 12) {
            pushUndo('drag anchor');
            state.selectedPart = partName;
            state.dragging = {
                part: partName,
                startMX: mx, startMY: my,
                startAX: pd.anchor.x, startAY: pd.anchor.y
            };
            rebuildPartsList();
            updatePropsPanel();
            render();
            return;
        }
    }

    // Check sprites
    for (var j = order.length - 1; j >= 0; j--) {
        var pn = order[j];
        var ppd = state.parts[pn];
        if (!ppd || !ppd.visible) continue;
        var mp = state.partMapping[pn] || pn;
        var img = state.images[mp] || state.images[pn];
        if (!img) continue;

        var ppos = getPartWorldPos(pn);
        var hw = (img.width / 2) * S;
        var hh = (img.height / 2) * S;
        if (mx >= ppos.x - hw && mx <= ppos.x + hw && my >= ppos.y - hh && my <= ppos.y + hh) {
            state.selectedPart = pn;
            rebuildPartsList();
            updatePropsPanel();
            render();
            return;
        }
    }
}

function onCanvasMouseMove(e) {
    if (!state.dragging) return;
    var rect = canvas.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    var my = (e.clientY - rect.top) * (canvas.height / rect.height);
    var S = state.zoom;

    var d = state.dragging;
    var dx = (mx - d.startMX) / S;
    var dy = -(my - d.startMY) / S;
    var pd = state.parts[d.part];
    pd.anchor.x = Math.round(d.startAX + dx);
    pd.anchor.y = Math.round(d.startAY + dy);

    updatePropsPanel();
    render();
}

function onCanvasMouseUp() {
    state.dragging = null;
}

// Equipment Overlay Drawing
function drawEquipmentOverlay(partName, sx, sy, totalRot) {
    var S = state.zoom;
    for (var slotType in EQUIP_ATTACH) {
        var attachPart = EQUIP_ATTACH[slotType];
        var shouldDraw = (partName === attachPart);
        // Mirror parts for legs/boots/gloves
        var mirrorMap = {
            'left_leg': 'right_leg',
            'left_foot': 'right_foot',
            'left_hand': 'right_hand',
        };
        if (mirrorMap[attachPart] === partName) shouldDraw = true;
        if (!shouldDraw) continue;

        var itemId = state.equipment[slotType] || 0;
        if (itemId === 0) continue;

        var items = EQUIPMENT_ITEMS[slotType];
        var item = null;
        for (var ii = 0; ii < items.length; ii++) {
            if (items[ii].id === itemId) { item = items[ii]; break; }
        }
        if (!item || !item.shape) continue;

        var offset = state.equipmentOffsets[slotType] || { x: 0, y: 0 };
        var ox = offset.x * (S / 4);
        var oy = -offset.y * (S / 4);

        ctx.save();
        ctx.translate(sx + ox, sy + oy);
        ctx.rotate(totalRot);

        // Draw glow
        if (item.glowColor) {
            ctx.beginPath();
            ctx.arc(0, 0, S * 3, 0, Math.PI * 2);
            ctx.fillStyle = item.glowColor;
            ctx.globalAlpha = 0.2;
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.fillStyle = item.color;

        switch (item.shape) {
            case 'sword':
                ctx.fillRect(-S * 0.3, -S * 4, S * 0.6, S * 3.5);
                ctx.strokeRect(-S * 0.3, -S * 4, S * 0.6, S * 3.5);
                ctx.fillStyle = '#5A3A1A';
                ctx.fillRect(-S * 0.4, -S * 0.5, S * 0.8, S * 1.2);
                ctx.strokeRect(-S * 0.4, -S * 0.5, S * 0.8, S * 1.2);
                ctx.fillStyle = item.color;
                ctx.fillRect(-S * 0.7, -S * 0.6, S * 1.4, S * 0.3);
                ctx.strokeRect(-S * 0.7, -S * 0.6, S * 1.4, S * 0.3);
                break;
            case 'katana':
                ctx.fillRect(-S * 0.2, -S * 5, S * 0.4, S * 4.5);
                ctx.strokeRect(-S * 0.2, -S * 5, S * 0.4, S * 4.5);
                ctx.fillStyle = '#3A2A0A';
                ctx.fillRect(-S * 0.3, -S * 0.5, S * 0.6, S * 1.5);
                ctx.strokeRect(-S * 0.3, -S * 0.5, S * 0.6, S * 1.5);
                break;
            case 'axe':
                ctx.fillStyle = '#5A3A1A';
                ctx.fillRect(-S * 0.2, -S * 3.5, S * 0.4, S * 3.5);
                ctx.strokeRect(-S * 0.2, -S * 3.5, S * 0.4, S * 3.5);
                ctx.fillStyle = item.color;
                ctx.beginPath();
                ctx.arc(-S * 0.2, -S * 3.5, S * 1.2, -Math.PI * 0.7, Math.PI * 0.2);
                ctx.fill();
                ctx.stroke();
                break;
            case 'staff':
                ctx.fillRect(-S * 0.15, -S * 5, S * 0.3, S * 5.5);
                ctx.strokeRect(-S * 0.15, -S * 5, S * 0.3, S * 5.5);
                ctx.fillStyle = item.glowColor || '#AADDFF';
                ctx.beginPath();
                ctx.arc(0, -S * 5.3, S * 0.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                break;
            case 'cap':
                ctx.beginPath();
                ctx.arc(0, -S * 0.5, S * 1.5, Math.PI, 0);
                ctx.fill();
                ctx.stroke();
                break;
            case 'helm':
                ctx.fillRect(-S * 1.5, -S * 1.8, S * 3, S * 1.8);
                ctx.strokeRect(-S * 1.5, -S * 1.8, S * 3, S * 1.8);
                ctx.fillStyle = '#222';
                ctx.fillRect(-S * 0.8, -S * 0.8, S * 1.6, S * 0.3);
                break;
            case 'crown':
                ctx.fillRect(-S * 1.3, -S * 0.8, S * 2.6, S * 0.5);
                ctx.strokeRect(-S * 1.3, -S * 0.8, S * 2.6, S * 0.5);
                for (var ci = -1; ci <= 1; ci++) {
                    ctx.beginPath();
                    ctx.moveTo(ci * S * 0.8 - S * 0.3, -S * 0.8);
                    ctx.lineTo(ci * S * 0.8, -S * 1.6);
                    ctx.lineTo(ci * S * 0.8 + S * 0.3, -S * 0.8);
                    ctx.fill();
                    ctx.stroke();
                }
                break;
            case 'tunic':
                ctx.globalAlpha = 0.5;
                ctx.fillRect(-S * 1.5, -S * 1.5, S * 3, S * 3);
                ctx.strokeRect(-S * 1.5, -S * 1.5, S * 3, S * 3);
                ctx.globalAlpha = 1;
                break;
            case 'chainmail':
                ctx.globalAlpha = 0.5;
                ctx.fillRect(-S * 1.6, -S * 1.6, S * 3.2, S * 3.2);
                ctx.strokeRect(-S * 1.6, -S * 1.6, S * 3.2, S * 3.2);
                ctx.globalAlpha = 0.3;
                for (var cr = -1; cr <= 1; cr++) {
                    for (var cc = -1; cc <= 1; cc++) {
                        ctx.beginPath();
                        ctx.arc(cc * S * 0.8, cr * S * 0.8, S * 0.2, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                }
                ctx.globalAlpha = 1;
                break;
            case 'plate':
                ctx.globalAlpha = 0.6;
                ctx.fillRect(-S * 1.7, -S * 1.7, S * 3.4, S * 3.4);
                ctx.strokeRect(-S * 1.7, -S * 1.7, S * 3.4, S * 3.4);
                ctx.strokeRect(-S * 1.2, -S * 1.2, S * 2.4, S * 2.4);
                ctx.globalAlpha = 1;
                break;
            case 'pants':
            case 'greaves':
                ctx.globalAlpha = 0.5;
                ctx.fillRect(-S * 0.8, -S * 1.2, S * 1.6, S * 2.4);
                ctx.strokeRect(-S * 0.8, -S * 1.2, S * 1.6, S * 2.4);
                ctx.globalAlpha = 1;
                break;
            case 'boots':
            case 'sabatons':
                ctx.globalAlpha = 0.5;
                ctx.fillRect(-S * 0.8, -S * 0.6, S * 1.6, S * 1.2);
                ctx.strokeRect(-S * 0.8, -S * 0.6, S * 1.6, S * 1.2);
                ctx.globalAlpha = 1;
                break;
            case 'gloves':
            case 'gauntlets':
                ctx.globalAlpha = 0.5;
                ctx.fillRect(-S * 0.6, -S * 0.6, S * 1.2, S * 1.2);
                ctx.strokeRect(-S * 0.6, -S * 0.6, S * 1.2, S * 1.2);
                ctx.globalAlpha = 1;
                break;
        }
        ctx.restore();
    }
}

// Canvas Rendering
function render() {
    var S = state.zoom;
    ctx.clearRect(0, 0, 512, 512);

    // Checkerboard
    var checkSize = 16;
    for (var cy = 0; cy < 512; cy += checkSize) {
        for (var cx = 0; cx < 512; cx += checkSize) {
            ctx.fillStyle = ((cx + cy) / checkSize) % 2 === 0 ? '#2a2a3e' : '#222238';
            ctx.fillRect(cx, cy, checkSize, checkSize);
        }
    }

    // Grid overlay
    if (state.showGrid) {
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 0.5;
        var gridStep = S * 4;
        for (var gx = CHAR_CENTER_X % gridStep; gx < 512; gx += gridStep) {
            ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, 512); ctx.stroke();
        }
        for (var gy = CHAR_CENTER_Y % gridStep; gy < 512; gy += gridStep) {
            ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(512, gy); ctx.stroke();
        }
    }

    // Crosshair
    if (state.showCrosshair) {
        ctx.strokeStyle = 'rgba(233,69,96,0.4)';
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.moveTo(CHAR_CENTER_X, 0); ctx.lineTo(CHAR_CENTER_X, 512); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, CHAR_CENTER_Y); ctx.lineTo(512, CHAR_CENTER_Y); ctx.stroke();
        ctx.setLineDash([]);
    }

    if (Object.keys(state.parts).length === 0) return;

    var order = state.drawOrder[state.direction] || [];
    var showBones = $('chk-bones').checked;
    var showAnchors = $('chk-anchors').checked;
    var torsoAnim = state.playing ? getAnimatedTransform('torso') : { rot: 0, y: 0 };

    // Onion skinning
    if (state.showOnion && state.playing) {
        var kfs = getActiveKeyframes();
        var prevFrame = (state.animFrame - 1 + kfs.length) % kfs.length;
        var nextFrame2 = (state.animFrame + 1) % kfs.length;
        var ghostFrames = [prevFrame, nextFrame2];

        for (var gi = 0; gi < ghostFrames.length; gi++) {
            var savedAnimFrame = state.animFrame;
            var savedAnimTime = state.animTime;
            state.animFrame = ghostFrames[gi];
            state.animTime = ghostFrames[gi];

            ctx.globalAlpha = 0.15;
            for (var oi = 0; oi < order.length; oi++) {
                var opn = order[oi];
                var opd = state.parts[opn];
                if (!opd || !opd.visible) continue;
                var omp = state.partMapping[opn] || opn;
                var oimg = state.images[omp] || state.images[opn];
                if (!oimg) continue;

                var oTorsoAnim = getAnimatedTransform('torso');
                var oax = opd.anchor.x;
                var oay = opd.anchor.y;
                var osx = CHAR_CENTER_X + (oax - 16) * S;
                var osy = CHAR_CENTER_Y - (oay - 16) * S - (oTorsoAnim.y || 0) * S;
                var oAnim = getAnimatedTransform(opn);
                var oTotalRot = (opd.rotation + (oAnim.rot || 0)) * Math.PI / 180;

                ctx.save();
                ctx.translate(osx, osy + (oAnim.y || 0) * S);
                ctx.rotate(oTotalRot);
                var ow = oimg.width * S;
                var oh = oimg.height * S;
                ctx.drawImage(oimg, -ow / 2, -oh / 2, ow, oh);
                ctx.restore();
            }
            ctx.globalAlpha = 1;

            state.animFrame = savedAnimFrame;
            state.animTime = savedAnimTime;
        }
    }

    // Draw parts
    for (var pi = 0; pi < order.length; pi++) {
        var partName = order[pi];
        var pd = state.parts[partName];
        if (!pd || !pd.visible) continue;
        var mappedPart = state.partMapping[partName] || partName;
        var img = state.images[mappedPart] || state.images[partName];
        if (!img) continue;

        var ax = pd.anchor.x;
        var ay = pd.anchor.y;
        var sx = CHAR_CENTER_X + (ax - 16) * S;
        var sy = CHAR_CENTER_Y - (ay - 16) * S - (torsoAnim.y || 0) * S;

        var anim = state.playing ? getAnimatedTransform(partName) : { rot: 0, y: 0 };
        var totalRot = (pd.rotation + (anim.rot || 0)) * Math.PI / 180;

        ctx.save();
        ctx.translate(sx, sy + (anim.y || 0) * S);
        ctx.rotate(totalRot);

        var w = img.width * S;
        var h = img.height * S;
        ctx.drawImage(img, -w / 2, -h / 2, w, h);

        if (partName === state.selectedPart) {
            ctx.strokeStyle = PART_COLORS[partName] || '#fff';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(-w / 2 - 2, -h / 2 - 2, w + 4, h + 4);
            ctx.setLineDash([]);
        }

        ctx.restore();

        // Equipment overlays
        drawEquipmentOverlay(partName, sx, sy + (anim.y || 0) * S, totalRot);
    }

    // Bones
    if (showBones) {
        for (var bi = 0; bi < order.length; bi++) {
            var bpn = order[bi];
            var bpd = state.parts[bpn];
            if (!bpd || !bpd.visible) continue;
            var parent = BONE_HIERARCHY[bpn];
            if (!parent || !state.parts[parent]) continue;

            var childPos = getPartWorldPos(bpn);
            var parentPos = getPartWorldPos(parent);

            ctx.beginPath();
            ctx.moveTo(parentPos.x, parentPos.y);
            ctx.lineTo(childPos.x, childPos.y);
            ctx.strokeStyle = PART_COLORS[bpn] || '#fff';
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.6;
            ctx.stroke();
            ctx.globalAlpha = 1;
        }
    }

    // Anchors
    if (showAnchors) {
        for (var ai = 0; ai < order.length; ai++) {
            var apn = order[ai];
            var apd = state.parts[apn];
            if (!apd || !apd.visible) continue;

            var apos = getPartWorldPos(apn);
            var color = PART_COLORS[apn] || '#fff';
            var isSelected = apn === state.selectedPart;
            var radius = isSelected ? 6 : 4;

            ctx.beginPath();
            ctx.arc(apos.x, apos.y, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.stroke();

            if (isSelected) {
                ctx.beginPath();
                ctx.arc(apos.x, apos.y, radius + 3, 0, Math.PI * 2);
                ctx.strokeStyle = color;
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }
    }
}

// Kick off
init();

</script>
</body>
</html>
