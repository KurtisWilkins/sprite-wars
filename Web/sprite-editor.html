<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Wars — Sprite Part Editor</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-dark: #1a1a2e;
            --bg-panel: #16213e;
            --bg-input: #0f3460;
            --accent: #e94560;
            --accent2: #0ea5e9;
            --text: #e0e0e0;
            --text-dim: #8899aa;
            --border: #2a2a4a;
            --sidebar-w: 320px;
        }
        body { background: var(--bg-dark); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 14px; overflow: hidden; height: 100vh; }
        .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr var(--sidebar-w); grid-template-rows: 48px 1fr 56px; height: 100vh; }
        .toolbar { grid-column: 1 / -1; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 8px; }
        .toolbar h1 { font-size: 16px; font-weight: 600; color: var(--accent); margin-right: 12px; white-space: nowrap; }
        .toolbar select, .toolbar button, .toolbar input { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; font-size: 13px; cursor: pointer; }
        .toolbar button:hover { background: var(--accent); }
        .toolbar .spacer { flex: 1; }
        .toolbar a { color: var(--text-dim); text-decoration: none; font-size: 12px; }
        .toolbar a:hover { color: var(--text); }
        .sidebar-left { grid-row: 2; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-left h2, .sidebar-right h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; padding: 8px 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .parts-list { flex: 1; overflow-y: auto; padding: 4px; }
        .part-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; user-select: none; }
        .part-item:hover { background: rgba(255,255,255,0.05); }
        .part-item.selected { border-color: var(--accent); background: rgba(233,69,96,0.1); }
        .part-item .drag-handle { cursor: grab; color: var(--text-dim); font-size: 16px; flex-shrink: 0; }
        .part-item .part-thumb { width: 32px; height: 32px; background: var(--bg-dark); border-radius: 3px; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .part-item .part-thumb img { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
        .part-item .part-name { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .part-item .part-vis { cursor: pointer; color: var(--text-dim); font-size: 14px; flex-shrink: 0; }
        .part-item .part-vis.hidden-part { opacity: 0.3; }
        .canvas-area { grid-row: 2; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        #main-canvas { image-rendering: pixelated; cursor: crosshair; }
        .canvas-info { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 4px 12px; border-radius: 4px; font-size: 11px; color: var(--text-dim); }
        .canvas-controls { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 4px; }
        .canvas-controls button { background: var(--bg-panel); color: var(--text); border: 1px solid var(--border); padding: 4px 8px; border-radius: 3px; font-size: 11px; cursor: pointer; min-width: 40px; }
        .canvas-controls button:hover { background: var(--accent); }
        .canvas-controls button.active { background: var(--accent2); }
        .sidebar-right { grid-row: 2; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
        .tab-bar { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .tab-bar button { flex: 1; background: none; border: none; color: var(--text-dim); padding: 8px 4px; font-size: 11px; cursor: pointer; border-bottom: 2px solid transparent; text-transform: uppercase; letter-spacing: 0.5px; }
        .tab-bar button:hover { color: var(--text); }
        .tab-bar button.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-content { flex: 1; overflow-y: auto; padding: 8px 12px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .prop-group { margin-bottom: 16px; }
        .prop-group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent2); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
        .prop-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .prop-row label { width: 80px; font-size: 12px; color: var(--text-dim); flex-shrink: 0; }
        .prop-row input[type="number"] { width: 60px; background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 3px 6px; border-radius: 3px; font-size: 12px; }
        .prop-row input[type="range"] { flex: 1; accent-color: var(--accent); }
        .prop-row .range-val { width: 40px; text-align: right; font-size: 11px; color: var(--text-dim); }
        .prop-row select { flex: 1; background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 3px 6px; border-radius: 3px; font-size: 12px; }
        .no-selection { color: var(--text-dim); font-style: italic; padding: 20px; text-align: center; }
        .mapping-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; padding: 4px 6px; background: var(--bg-dark); border-radius: 4px; }
        .mapping-row .slot-label { width: 80px; font-size: 11px; color: var(--text-dim); flex-shrink: 0; text-transform: capitalize; }
        .mapping-row select { flex: 1; background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 3px 6px; border-radius: 3px; font-size: 11px; }
        .mapping-row .reset-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 14px; padding: 2px; }
        .mapping-row .reset-btn:hover { color: var(--accent); }
        .equip-slot { margin-bottom: 10px; padding: 6px 8px; background: var(--bg-dark); border-radius: 4px; }
        .equip-slot h4 { font-size: 11px; color: var(--accent2); margin-bottom: 4px; text-transform: uppercase; }
        .equip-slot select { width: 100%; background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 4px 6px; border-radius: 3px; font-size: 12px; margin-bottom: 4px; }
        .equip-offset { display: flex; gap: 6px; align-items: center; }
        .equip-offset label { font-size: 10px; color: var(--text-dim); }
        .equip-offset input { width: 45px; background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 2px 4px; border-radius: 3px; font-size: 11px; }
        .color-preview { display: inline-block; width: 14px; height: 14px; border-radius: 2px; border: 1px solid var(--border); vertical-align: middle; margin-left: 4px; }
        .statusbar { grid-column: 1 / -1; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 12px; font-size: 12px; color: var(--text-dim); }
        .statusbar .status-section { display: flex; align-items: center; gap: 6px; }
        .statusbar button { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 2px 10px; border-radius: 3px; font-size: 12px; cursor: pointer; }
        .statusbar button:hover { background: var(--accent); }
        .statusbar select { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 2px 6px; border-radius: 3px; font-size: 12px; }
        .statusbar .spacer { flex: 1; }
        .statusbar label { font-size: 12px; }
        .statusbar input[type="range"] { width: 80px; accent-color: var(--accent); }
        .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--accent2); color: #fff; padding: 8px 20px; border-radius: 4px; font-size: 13px; z-index: 1000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
        .drop-indicator { height: 2px; background: var(--accent); margin: 0 4px; }
        @media (max-width: 900px) {
            .app { grid-template-columns: 1fr; grid-template-rows: 48px auto 300px 56px; }
            .sidebar-left { grid-row: 3; border-right: none; border-top: 1px solid var(--border); }
            .sidebar-right { display: none; }
            .canvas-area { grid-row: 2; }
            .statusbar { grid-row: 4; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="toolbar">
        <h1>Sprite Part Editor</h1>
        <label>Race:</label>
        <select id="race-select"></select>
        <label>Stage:</label>
        <select id="stage-select">
            <option value="1">Stage 1</option>
            <option value="2">Stage 2</option>
            <option value="3">Stage 3</option>
        </select>
        <button id="btn-load" title="Load skeleton from server">Load</button>
        <button id="btn-save" title="Save skeleton + config">Save</button>
        <button id="btn-export" title="Download skeleton.json">Export</button>
        <button id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
        <span class="spacer"></span>
        <label><input type="checkbox" id="chk-bones" checked> Bones</label>
        <label><input type="checkbox" id="chk-anchors" checked> Anchors</label>
        <span class="spacer"></span>
        <a href="index.html">Game</a>
        <a href="tile-admin.html">Tiles</a>
    </div>
    <div class="sidebar-left">
        <h2>Parts / Draw Order</h2>
        <div class="parts-list" id="parts-list">
            <div class="no-selection">Select a race and stage, then click Load.</div>
        </div>
    </div>
    <div class="canvas-area">
        <canvas id="main-canvas" width="512" height="512"></canvas>
        <div class="canvas-controls">
            <button id="btn-grid" title="Toggle pixel grid">Grid</button>
            <button id="btn-crosshair" title="Toggle center crosshair">Cross</button>
            <button id="btn-onion" title="Toggle onion skinning">Onion</button>
            <button id="btn-zoom-in" title="Zoom in">+</button>
            <button id="btn-zoom-out" title="Zoom out">-</button>
            <span id="zoom-label" style="font-size:10px;color:var(--text-dim);text-align:center;">4x</span>
        </div>
        <div class="canvas-info" id="canvas-info">No data loaded</div>
    </div>
    <div class="sidebar-right">
        <div class="tab-bar">
            <button class="active" data-tab="props-tab">Properties</button>
            <button data-tab="equip-tab">Equipment</button>
            <button data-tab="mapping-tab">Mapping</button>
        </div>
        <div class="tab-content">
            <div class="tab-panel active" id="props-tab">
                <div id="props-panel"><div class="no-selection">Select a part to edit.</div></div>
            </div>
            <div class="tab-panel" id="equip-tab">
                <div id="equip-panel"></div>
            </div>
            <div class="tab-panel" id="mapping-tab">
                <div id="mapping-panel"></div>
            </div>
        </div>
    </div>
    <div class="statusbar">
        <div class="status-section">
            <button id="btn-play">Play</button>
            <button id="btn-stop">Stop</button>
            <button id="btn-step-back" title="Previous frame">|&lt;</button>
            <button id="btn-step-fwd" title="Next frame">&gt;|</button>
        </div>
        <div class="status-section">
            <label>Anim:</label>
            <select id="anim-select">
                <option value="walk">Walk</option>
                <option value="idle">Idle</option>
                <option value="attack">Attack</option>
                <option value="hit">Hit</option>
                <option value="death">Death</option>
            </select>
        </div>
        <div class="status-section">
            <label>Dir:</label>
            <select id="dir-select">
                <option value="down">Down</option>
                <option value="left">Left</option>
                <option value="right">Right</option>
                <option value="up">Up</option>
            </select>
        </div>
        <div class="status-section">
            <label>Speed:</label>
            <input type="range" id="speed-slider" min="0.1" max="3" step="0.1" value="1" style="width:80px">
            <span id="speed-val">1.0x</span>
        </div>
        <div class="status-section">
            <label><input type="checkbox" id="chk-loop" checked> Loop</label>
        </div>
        <div class="status-section">
            <span id="frame-info">Frame: 0/4</span>
        </div>
        <span class="spacer"></span>
        <span id="status-msg">Ready</span>
    </div>
</div>
<div class="toast" id="toast"></div>

    showGrid: false, showCrosshair: false, showOnion: false,
    zoom: 4, loop: true,
};

// ─── Undo System ───
const undoStack = [];
const MAX_UNDO = 20;

function pushUndo(desc) {
    undoStack.push({
        desc,
        parts: JSON.parse(JSON.stringify(state.parts)),
        partMapping: { ...state.partMapping },
        equipment: { ...state.equipment },
        equipmentOffsets: JSON.parse(JSON.stringify(state.equipmentOffsets)),
        drawOrder: JSON.parse(JSON.stringify(state.drawOrder)),
    });
    if (undoStack.length > MAX_UNDO) undoStack.shift();
}

function popUndo() {
    if (!undoStack.length) { toast('Nothing to undo'); return; }
    const snap = undoStack.pop();
    state.parts = snap.parts;
    state.partMapping = snap.partMapping;
    state.equipment = snap.equipment;
    state.equipmentOffsets = snap.equipmentOffsets;
    state.drawOrder = snap.drawOrder;
    rebuildPartsList(); updatePropsPanel(); updateMappingPanel(); updateEquipPanel(); render();
    toast('Undo: ' + snap.desc);
}

// ─── DOM Refs ───
const $ = id => document.getElementById(id);
const canvas = $('main-canvas');
const ctx = canvas.getContext('2d');
const raceSelect = $('race-select');
const stageSelect = $('stage-select');
const partsList = $('parts-list');
const propsPanel = $('props-panel');
const canvasInfo = $('canvas-info');
const statusMsg = $('status-msg');
const dirSelect = $('dir-select');
const animSelect = $('anim-select');
const speedSlider = $('speed-slider');
const speedVal = $('speed-val');
const frameInfo = $('frame-info');
const toastEl = $('toast');
const CHAR_CENTER_X = 256;
const CHAR_CENTER_Y = 256;

// ─── Toast ───
let toastTimeout;
function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

// ─── Tab Switching ───
function switchTab(tabId) {
    document.querySelectorAll('.tab-bar button').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === tabId));
}

// ─── Get mapped image for a slot ───
function getImageForSlot(slotName) {
    const src = state.partMapping[slotName] || slotName;
    return state.images[src] || null;
}

// ─── Init ───
function init() {
    for (const [id, name] of Object.entries(RACES)) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = id + '. ' + name;
        raceSelect.appendChild(opt);
    }

    $('btn-load').addEventListener('click', loadSkeleton);
    $('btn-save').addEventListener('click', saveSkeleton);
    $('btn-export').addEventListener('click', exportSkeleton);
    $('btn-undo').addEventListener('click', popUndo);
    $('btn-play').addEventListener('click', togglePlay);
    $('btn-stop').addEventListener('click', stopPlay);
    $('btn-step-back').addEventListener('click', () => stepFrame(-1));
    $('btn-step-fwd').addEventListener('click', () => stepFrame(1));
    dirSelect.addEventListener('change', () => { state.direction = dirSelect.value; rebuildPartsList(); render(); });
    animSelect.addEventListener('change', () => { state.animType = animSelect.value; state.animFrame = 0; state.animTime = 0; render(); });
    speedSlider.addEventListener('input', () => { state.speed = parseFloat(speedSlider.value); speedVal.textContent = state.speed.toFixed(1) + 'x'; });
    $('chk-bones').addEventListener('change', render);
    $('chk-anchors').addEventListener('change', render);
    $('chk-loop').addEventListener('change', () => { state.loop = $('chk-loop').checked; });
    raceSelect.addEventListener('change', () => { state.race = raceSelect.value; });
    stageSelect.addEventListener('change', () => { state.stage = parseInt(stageSelect.value); });

    // Canvas controls
    $('btn-grid').addEventListener('click', () => { state.showGrid = !state.showGrid; $('btn-grid').classList.toggle('active', state.showGrid); render(); });
    $('btn-crosshair').addEventListener('click', () => { state.showCrosshair = !state.showCrosshair; $('btn-crosshair').classList.toggle('active', state.showCrosshair); render(); });
    $('btn-onion').addEventListener('click', () => { state.showOnion = !state.showOnion; $('btn-onion').classList.toggle('active', state.showOnion); render(); });
    $('btn-zoom-in').addEventListener('click', () => { if (state.zoom < 8) { state.zoom *= 2; updateCanvasSize(); } });
    $('btn-zoom-out').addEventListener('click', () => { if (state.zoom > 1) { state.zoom /= 2; updateCanvasSize(); } });

    // Tab switching
    document.querySelectorAll('.tab-bar button').forEach(btn => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // Canvas mouse
    canvas.addEventListener('mousedown', onCanvasMouseDown);
    canvas.addEventListener('mousemove', onCanvasMouseMove);
    canvas.addEventListener('mouseup', onCanvasMouseUp);
    canvas.addEventListener('mouseleave', onCanvasMouseUp);

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (e.ctrlKey && e.key === 'z') { e.preventDefault(); popUndo(); }
        else if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveSkeleton(); }
        else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); stepFrame(-1); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); stepFrame(1); }
        else if (e.key === '1') dirSelect.value = 'down';
        else if (e.key === '2') dirSelect.value = 'left';
        else if (e.key === '3') dirSelect.value = 'right';
        else if (e.key === '4') dirSelect.value = 'up';
        if (['1','2','3','4'].includes(e.key)) { state.direction = dirSelect.value; rebuildPartsList(); render(); }
    });

    updateEquipPanel();
    updateMappingPanel();
    updateCanvasSize();
    requestAnimationFrame(tick);
}

function updateCanvasSize() {
    const size = 64 * state.zoom;
    canvas.width = size;
    canvas.height = size;
    $('zoom-label').textContent = state.zoom + 'x';
    render();
}

// ─── Load / Save ───
async function loadSkeleton() {
    const race = state.race;
    const stage = state.stage;
    statusMsg.textContent = 'Loading ' + race + ' S' + stage + '...';
    state.parts = {};
    state.images = {};
    state.selectedPart = null;
    state.skeletonData = null;
    state.partMapping = {};
    state.equipment = {};
    state.equipmentOffsets = {};

    // Load skeleton JSON
    const skelUrl = '../Sprites/Characters/' + race + '/parts/' + race + '_S' + stage + '_skeleton.json';
    let skelData = null;
    try {
        const resp = await fetch(skelUrl);
        if (resp.ok) { skelData = await resp.json(); state.skeletonData = skelData; }
    } catch (e) { /* no skeleton yet */ }

    // Init draw order
    state.drawOrder = {};
    for (const dir of ['down','up','left','right']) {
        if (skelData && skelData.draw_order && Array.isArray(skelData.draw_order)) {
            state.drawOrder[dir] = [...skelData.draw_order];
        } else {
            state.drawOrder[dir] = [...DEFAULT_DRAW_ORDER[dir]];
        }
    }

    // Load part images
    const loadPromises = [];
    for (const part of BODY_PARTS) {
        const imgUrl = '../Sprites/Characters/' + race + '/parts/' + race + '_S' + stage + '_' + part + '.png';
        const img = new Image();
        const p = new Promise(resolve => {
            img.onload = () => {
                state.images[part] = img;
                const anchor = (skelData && skelData.parts && skelData.parts[part])
                    ? { x: skelData.parts[part].anchor.x, y: skelData.parts[part].anchor.y }
                    : { ...DEFAULT_ANCHORS[part] };
                const rotation = (skelData && skelData.bones && skelData.bones[part])
                    ? (skelData.bones[part].rotation || 0)
                    : (skelData && skelData.parts && skelData.parts[part])
                        ? (skelData.parts[part].rotation || 0) : 0;
                state.parts[part] = { anchor, rotation, visible: true };
                resolve(true);
            };
            img.onerror = () => resolve(false);
        });
        img.src = imgUrl;
        loadPromises.push(p);
    }

    const results = await Promise.all(loadPromises);
    const loadedCount = results.filter(Boolean).length;

    // Clean draw order
    for (const dir of ['down','up','left','right']) {
        state.drawOrder[dir] = state.drawOrder[dir].filter(p => state.images[p]);
        for (const part of BODY_PARTS) {
            if (state.images[part] && !state.drawOrder[dir].includes(part)) {
                state.drawOrder[dir].push(part);
            }
        }
    }

    // Load editor config
    try {
        const cfgResp = await fetch('/api/editor-config/load?race=' + encodeURIComponent(race) + '&stage=' + stage);
        if (cfgResp.ok) {
            const cfgData = await cfgResp.json();
            if (cfgData && cfgData.config) {
                const cfg = cfgData.config;
                if (cfg.part_mapping) state.partMapping = cfg.part_mapping;
                if (cfg.equipment_loadout) state.equipment = cfg.equipment_loadout;
                if (cfg.equipment_offsets) state.equipmentOffsets = cfg.equipment_offsets;
            }
        }
    } catch (e) { /* no config */ }

    rebuildPartsList();
    updateMappingPanel();
    updateEquipPanel();
    canvasInfo.textContent = race + ' Stage ' + stage + ' \u2014 ' + loadedCount + ' parts loaded';
    statusMsg.textContent = 'Loaded ' + loadedCount + ' parts';
    toast('Loaded ' + race + ' S' + stage + ': ' + loadedCount + ' parts');
    render();
}

async function saveSkeleton() {
    const data = buildSkeletonJson();
    statusMsg.textContent = 'Saving...';

    // Save skeleton
    try {
        const resp = await fetch('/api/skeleton/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ race: state.race, stage: state.stage, data })
        });
        const result = await resp.json();
        if (!result.success) { toast('Skeleton save failed: ' + (result.error || 'Unknown')); statusMsg.textContent = 'Save failed'; return; }
    } catch (e) { toast('Save error: ' + e.message); statusMsg.textContent = 'Save error'; return; }

    // Save editor config
    try {
        const cfgResp = await fetch('/api/editor-config/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                race: state.race, stage: state.stage,
                config: {
                    part_mapping: state.partMapping,
                    equipment_loadout: state.equipment,
                    equipment_offsets: state.equipmentOffsets,
                }
            })
        });
        const cfgResult = await cfgResp.json();
        if (!cfgResult.success) { toast('Config save failed'); }
    } catch (e) { toast('Config save warning: ' + e.message); }

    toast('Saved successfully');
    statusMsg.textContent = 'Saved';
}

function exportSkeleton() {
    const data = buildSkeletonJson();
    data.editor_config = {
        part_mapping: state.partMapping,
        equipment_loadout: state.equipment,
        equipment_offsets: state.equipmentOffsets,
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = state.race + '_S' + state.stage + '_skeleton.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Exported skeleton.json');
}

function buildSkeletonJson() {
    const origParts = (state.skeletonData && state.skeletonData.parts) || {};
    const parts = {};
    for (const [name, pd] of Object.entries(state.parts)) {
        const orig = origParts[name] || {};
        const partEntry = { anchor: { x: pd.anchor.x, y: pd.anchor.y } };
        if (orig.file !== undefined) partEntry.file = orig.file;
        if (orig.width !== undefined) partEntry.width = orig.width;
        if (orig.height !== undefined) partEntry.height = orig.height;
        if (orig.source_bbox !== undefined) partEntry.source_bbox = orig.source_bbox;
        if (orig.source_center !== undefined) partEntry.source_center = orig.source_center;
        parts[name] = partEntry;
    }

    const source_size = (state.skeletonData && state.skeletonData.source_size) || 1;
    const bones = {};
    for (const [name, pd] of Object.entries(state.parts)) {
        const origBones = (state.skeletonData && state.skeletonData.bones) || {};
        const origBone = origBones[name] || {};
        const parentName = BONE_HIERARCHY[name] || null;
        let offset_x, offset_y;
        const orig = origParts[name] || {};
        if (orig.source_center !== undefined && parentName === null) {
            offset_x = Math.round((orig.source_center.x / source_size) * 1000) / 1000;
            offset_y = Math.round((orig.source_center.y / source_size) * 1000) / 1000;
        } else if (orig.source_center !== undefined && parentName !== null) {
            const parentOrig = origParts[parentName] || {};
            if (parentOrig.source_center !== undefined) {
                offset_x = Math.round(((orig.source_center.x / source_size) - (parentOrig.source_center.x / source_size)) * 1000) / 1000;
                offset_y = Math.round(((orig.source_center.y / source_size) - (parentOrig.source_center.y / source_size)) * 1000) / 1000;
            } else {
                offset_x = origBone.offset_x !== undefined ? origBone.offset_x : (PARENT_ATTACH[name] ? PARENT_ATTACH[name].x : 0);
                offset_y = origBone.offset_y !== undefined ? origBone.offset_y : (PARENT_ATTACH[name] ? PARENT_ATTACH[name].y : 0);
            }
        } else {
            offset_x = origBone.offset_x !== undefined ? origBone.offset_x : (PARENT_ATTACH[name] ? PARENT_ATTACH[name].x : 0);
            offset_y = origBone.offset_y !== undefined ? origBone.offset_y : (PARENT_ATTACH[name] ? PARENT_ATTACH[name].y : 0);
        }
        bones[name] = { parent: parentName, offset_x, offset_y, rotation: pd.rotation, scale: origBone.scale !== undefined ? origBone.scale : 1.0 };
    }

    const draw_order = state.drawOrder[state.direction] || state.drawOrder['down'] || [];
    const result = { race: state.race, stage: state.stage };
    if (state.skeletonData && state.skeletonData.source_size !== undefined) result.source_size = state.skeletonData.source_size;
    result.parts = parts;
    result.bones = bones;
    result.draw_order = draw_order;
    return result;
}

// ─── Parts List UI ───
function rebuildPartsList() {
    partsList.innerHTML = '';
    const order = state.drawOrder[state.direction] || [];
    order.forEach((partName) => {
        const mappedImg = getImageForSlot(partName);
        if (!mappedImg && !state.images[partName]) return;
        const pd = state.parts[partName];
        if (!pd) return;

        const item = document.createElement('div');
        item.className = 'part-item' + (state.selectedPart === partName ? ' selected' : '');
        item.dataset.part = partName;
        item.draggable = true;

        const handle = document.createElement('span');
        handle.className = 'drag-handle';
        handle.textContent = '\u2630';

        const thumb = document.createElement('div');
        thumb.className = 'part-thumb';
        const dispImg = getImageForSlot(partName) || state.images[partName];
        if (dispImg) {
            const thumbImg = document.createElement('img');
            thumbImg.src = dispImg.src;
            thumb.appendChild(thumbImg);
        }

        const nameEl = document.createElement('span');
        nameEl.className = 'part-name';
        const mapped = state.partMapping[partName];
        nameEl.textContent = partName.replace(/_/g, ' ') + (mapped && mapped !== partName ? ' \u2190 ' + mapped.replace(/_/g, ' ') : '');

        const vis = document.createElement('span');
        vis.className = 'part-vis' + (pd.visible ? '' : ' hidden-part');
        vis.textContent = pd.visible ? '\u{1F441}' : '\u2014';
        vis.title = 'Toggle visibility';
        vis.addEventListener('click', (e) => { e.stopPropagation(); pd.visible = !pd.visible; rebuildPartsList(); render(); });

        item.appendChild(handle);
        item.appendChild(thumb);
        item.appendChild(nameEl);
        item.appendChild(vis);

        item.addEventListener('click', () => { state.selectedPart = partName; rebuildPartsList(); updatePropsPanel(); render(); });

        item.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', partName); item.classList.add('dragging'); });
        item.addEventListener('dragend', () => { item.classList.remove('dragging'); document.querySelectorAll('.drop-indicator').forEach(el => el.remove()); });
        item.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
        item.addEventListener('drop', (e) => {
            e.preventDefault();
            const draggedPart = e.dataTransfer.getData('text/plain');
            if (draggedPart === partName) return;
            pushUndo('reorder ' + draggedPart);
            const order = state.drawOrder[state.direction];
            const fromIdx = order.indexOf(draggedPart);
            const toIdx = order.indexOf(partName);
            if (fromIdx < 0 || toIdx < 0) return;
            order.splice(fromIdx, 1);
            order.splice(toIdx, 0, draggedPart);
            rebuildPartsList(); render();
        });

        partsList.appendChild(item);
    });
}

// ─── Properties Panel ───
function updatePropsPanel() {
    const part = state.selectedPart;
    if (!part || !state.parts[part]) {
        propsPanel.innerHTML = '<div class="no-selection">Select a part to edit.</div>';
        return;
    }
    const pd = state.parts[part];
    propsPanel.innerHTML = '<div class="prop-group"><h3>' + part.replace(/_/g, ' ') + '</h3>'
        + '<div class="prop-row"><label>Anchor X:</label><input type="number" id="prop-ax" value="' + pd.anchor.x + '" step="1"></div>'
        + '<div class="prop-row"><label>Anchor Y:</label><input type="number" id="prop-ay" value="' + pd.anchor.y + '" step="1"></div>'
        + '</div>'
        + '<div class="prop-group"><h3>Bone Rotation</h3>'
        + '<div class="prop-row"><label>Default:</label><input type="range" id="prop-rot" min="-180" max="180" step="1" value="' + pd.rotation + '"><span class="range-val" id="prop-rot-val">' + pd.rotation + '\u00B0</span></div>'
        + '</div>'
        + '<div class="prop-group"><h3>Hierarchy</h3>'
        + '<div class="prop-row"><label>Parent:</label><span style="color:var(--text-dim)">' + (BONE_HIERARCHY[part] || '(root)') + '</span></div>'
        + '<div class="prop-row"><label>Attach X:</label><input type="number" id="prop-pax" value="' + ((PARENT_ATTACH[part] || {x:0}).x) + '" step="1"></div>'
        + '<div class="prop-row"><label>Attach Y:</label><input type="number" id="prop-pay" value="' + ((PARENT_ATTACH[part] || {y:0}).y) + '" step="1"></div>'
        + '</div>'
        + '<div class="prop-group"><h3>Draw Order</h3>'
        + '<div class="prop-row"><label>Direction:</label><span style="color:var(--text-dim)">' + state.direction + '</span></div>'
        + '<div class="prop-row"><label>Index:</label><span style="color:var(--text-dim)">' + ((state.drawOrder[state.direction] || []).indexOf(part)) + '</span></div>'
        + '</div>';

    $('prop-ax').addEventListener('change', (e) => { pushUndo('anchor ' + part); pd.anchor.x = parseInt(e.target.value) || 0; render(); });
    $('prop-ay').addEventListener('change', (e) => { pushUndo('anchor ' + part); pd.anchor.y = parseInt(e.target.value) || 0; render(); });
    $('prop-rot').addEventListener('input', (e) => { pd.rotation = parseInt(e.target.value) || 0; $('prop-rot-val').textContent = pd.rotation + '\u00B0'; render(); });
    $('prop-rot').addEventListener('change', () => { pushUndo('rotate ' + part); });
    $('prop-pax').addEventListener('change', (e) => { pushUndo('attach ' + part); if (!PARENT_ATTACH[part]) PARENT_ATTACH[part] = { x: 0, y: 0 }; PARENT_ATTACH[part].x = parseInt(e.target.value) || 0; render(); });
    $('prop-pay').addEventListener('change', (e) => { pushUndo('attach ' + part); if (!PARENT_ATTACH[part]) PARENT_ATTACH[part] = { x: 0, y: 0 }; PARENT_ATTACH[part].y = parseInt(e.target.value) || 0; render(); });
}

// ─── Equipment Panel ───
function updateEquipPanel() {
    const panel = $('equip-panel');
    panel.innerHTML = '';
    for (const [slotType, items] of Object.entries(EQUIPMENT_ITEMS)) {
        const div = document.createElement('div');
        div.className = 'equip-slot';
        const currentId = state.equipment[slotType] || 0;
        const currentItem = items.find(i => i.id === currentId) || items[0];

        let colorPreview = '';
        if (currentItem && currentItem.color) {
            colorPreview = '<span class="color-preview" style="background:' + currentItem.color + '"></span>';
        }

        div.innerHTML = '<h4>' + slotType + ' ' + colorPreview + '</h4>'
            + '<select data-slot="' + slotType + '">'
            + items.map(i => '<option value="' + i.id + '"' + (i.id === currentId ? ' selected' : '') + '>' + i.name + '</option>').join('')
            + '</select>'
            + '<div class="equip-offset">'
            + '<label>X:</label><input type="number" data-slot-offset="' + slotType + '-x" value="' + ((state.equipmentOffsets[slotType] || {}).x || 0) + '" step="1">'
            + '<label>Y:</label><input type="number" data-slot-offset="' + slotType + '-y" value="' + ((state.equipmentOffsets[slotType] || {}).y || 0) + '" step="1">'
            + '</div>';
        panel.appendChild(div);

        div.querySelector('select').addEventListener('change', (e) => {
            pushUndo('equip ' + slotType);
            state.equipment[slotType] = parseInt(e.target.value);
            updateEquipPanel();
            render();
        });
        const offX = div.querySelector('[data-slot-offset="' + slotType + '-x"]');
        const offY = div.querySelector('[data-slot-offset="' + slotType + '-y"]');
        offX.addEventListener('change', (e) => {
            pushUndo('equip offset ' + slotType);
            if (!state.equipmentOffsets[slotType]) state.equipmentOffsets[slotType] = { x: 0, y: 0 };
            state.equipmentOffsets[slotType].x = parseInt(e.target.value) || 0;
            render();
        });
        offY.addEventListener('change', (e) => {
            pushUndo('equip offset ' + slotType);
            if (!state.equipmentOffsets[slotType]) state.equipmentOffsets[slotType] = { x: 0, y: 0 };
            state.equipmentOffsets[slotType].y = parseInt(e.target.value) || 0;
            render();
        });
    }
}

// ─── Mapping Panel ───
function updateMappingPanel() {
    const panel = $('mapping-panel');
    panel.innerHTML = '';

    // Copy Body From section
    const copyGroup = document.createElement('div');
    copyGroup.className = 'prop-group';
    copyGroup.innerHTML = '<h3>Copy Body From Race</h3><div class="prop-row"><label>Source:</label><select id="copy-body-select">'
        + '<option value="">(Select race...)</option>'
        + Object.values(RACES).map(r => '<option value="' + r + '">' + r + '</option>').join('')
        + '</select></div><div style="font-size:11px;color:var(--text-dim);margin-top:4px;">Copies all body part textures except head from the selected race.</div>';
    panel.appendChild(copyGroup);

    const copySelect = copyGroup.querySelector('#copy-body-select');
    copySelect.addEventListener('change', async () => {
        const sourceRace = copySelect.value;
        if (!sourceRace) return;
        pushUndo('copy body from ' + sourceRace);
        await copyBodyFrom(sourceRace);
        copySelect.value = '';
    });

    // Part mapping section
    const mapGroup = document.createElement('div');
    mapGroup.className = 'prop-group';
    mapGroup.innerHTML = '<h3>Body Part Texture Mapping</h3><div style="font-size:11px;color:var(--text-dim);margin-bottom:8px;">Reassign which texture image is used for each body part slot.</div>';

    const loadedParts = Object.keys(state.images);
    for (const part of BODY_PARTS) {
        if (!state.parts[part]) continue;
        const row = document.createElement('div');
        row.className = 'mapping-row';
        const currentSource = state.partMapping[part] || part;

        row.innerHTML = '<span class="slot-label">' + part.replace(/_/g, ' ') + '</span>'
            + '<select data-map-slot="' + part + '">'
            + loadedParts.map(p => '<option value="' + p + '"' + (p === currentSource ? ' selected' : '') + '>' + p.replace(/_/g, ' ') + '</option>').join('')
            + '</select>'
            + '<button class="reset-btn" data-reset-slot="' + part + '" title="Reset to default">\u21A9</button>';

        mapGroup.appendChild(row);
    }
    panel.appendChild(mapGroup);

    // Wire mapping dropdowns
    panel.querySelectorAll('[data-map-slot]').forEach(sel => {
        sel.addEventListener('change', (e) => {
            const slot = sel.dataset.mapSlot;
            const source = e.target.value;
            pushUndo('remap ' + slot);
            if (source === slot) {
                delete state.partMapping[slot];
            } else {
                state.partMapping[slot] = source;
            }
            rebuildPartsList();
            render();
        });
    });

    // Wire reset buttons
    panel.querySelectorAll('[data-reset-slot]').forEach(btn => {
        btn.addEventListener('click', () => {
            const slot = btn.dataset.resetSlot;
            pushUndo('reset mapping ' + slot);
            delete state.partMapping[slot];
            updateMappingPanel();
            rebuildPartsList();
            render();
        });
    });
}

async function copyBodyFrom(sourceRace) {
    const stage = state.stage;
    statusMsg.textContent = 'Copying body from ' + sourceRace + '...';

    // Load source images (all except head)
    const partsToLoad = BODY_PARTS.filter(p => p !== 'head');
    const loadPromises = [];
    for (const part of partsToLoad) {
        const imgUrl = '../Sprites/Characters/' + sourceRace + '/parts/' + sourceRace + '_S' + stage + '_' + part + '.png';
        const img = new Image();
        const p = new Promise(resolve => {
            img.onload = () => {
                state.images['_ext_' + sourceRace + '_' + part] = img;
                state.partMapping[part] = '_ext_' + sourceRace + '_' + part;
                resolve(true);
            };
            img.onerror = () => resolve(false);
        });
        img.src = imgUrl;
        loadPromises.push(p);
    }
    const results = await Promise.all(loadPromises);
    const loaded = results.filter(Boolean).length;

    rebuildPartsList();
    updateMappingPanel();
    render();
    toast('Copied ' + loaded + ' body parts from ' + sourceRace);
    statusMsg.textContent = 'Body copied from ' + sourceRace;
}

// ─── Animation ───
function togglePlay() {
    state.playing = !state.playing;
    $('btn-play').textContent = state.playing ? 'Pause' : 'Play';
}

function stopPlay() {
    state.playing = false;
    state.animFrame = 0;
    state.animTime = 0;
    $('btn-play').textContent = 'Play';
    const kfs = ANIM_KEYFRAMES[state.animType] || ANIM_KEYFRAMES.walk;
    frameInfo.textContent = 'Frame: 0/' + kfs.length;
    render();
}

function stepFrame(delta) {
    const kfs = ANIM_KEYFRAMES[state.animType] || ANIM_KEYFRAMES.walk;
    state.animFrame = ((state.animFrame + delta) % kfs.length + kfs.length) % kfs.length;
    state.animTime = state.animFrame;
    frameInfo.textContent = 'Frame: ' + state.animFrame + '/' + kfs.length;
    render();
}

let lastTime = 0;
function tick(time) {
    if (state.playing) {
        const dt = (time - lastTime) / 1000;
        const kfs = ANIM_KEYFRAMES[state.animType] || ANIM_KEYFRAMES.walk;
        const baseSpeed = state.animType === 'idle' ? 2 : 4;
        state.animTime += dt * state.speed * baseSpeed;

        if (!state.loop && state.animTime >= kfs.length) {
            state.animTime = kfs.length - 0.01;
            state.playing = false;
            $('btn-play').textContent = 'Play';
        }

        state.animFrame = Math.floor(state.animTime) % kfs.length;
        frameInfo.textContent = 'Frame: ' + state.animFrame + '/' + kfs.length;
        render();
    }
    lastTime = time;
    requestAnimationFrame(tick);
}

function getAnimatedTransform(partName) {
    const kfs = ANIM_KEYFRAMES[state.animType] || ANIM_KEYFRAMES.walk;
    const frame = kfs[state.animFrame % kfs.length];
    const nextFrame = kfs[(state.animFrame + 1) % kfs.length];
    const t = (state.animTime % 1);
    const kf = frame[partName];
    const nkf = nextFrame[partName];
    if (!kf) return { rot: 0, y: 0 };
    const rot = (kf.rot || 0) + ((nkf ? (nkf.rot || 0) : 0) - (kf.rot || 0)) * t;
    const y = (kf.y || 0) + ((nkf ? (nkf.y || 0) : 0) - (kf.y || 0)) * t;
    return { rot, y };
}

// ─── Canvas Mouse Interaction ───
function getPartWorldPos(partName) {
    const pd = state.parts[partName];
    if (!pd) return { x: CHAR_CENTER_X, y: CHAR_CENTER_Y };
    const ax = pd.anchor.x;
    const ay = pd.anchor.y;
    const torsoAnim = state.playing ? getAnimatedTransform('torso') : { rot: 0, y: 0 };
    const Z = state.zoom;
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const sx = cx + (ax - 16) * Z;
    const sy = cy - (ay - 16) * Z - (torsoAnim.y || 0) * Z;
    return { x: sx, y: sy };
}

function onCanvasMouseDown(e) {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    const order = state.drawOrder[state.direction] || [];

    for (let i = order.length - 1; i >= 0; i--) {
        const partName = order[i];
        const pd = state.parts[partName];
        if (!pd || !pd.visible) continue;
        const img = getImageForSlot(partName);
        if (!img) continue;
        const pos = getPartWorldPos(partName);
        const dist = Math.sqrt((mx - pos.x) ** 2 + (my - pos.y) ** 2);
        if (dist < 12) {
            state.selectedPart = partName;
            state.dragging = { part: partName, startMX: mx, startMY: my, startAX: pd.anchor.x, startAY: pd.anchor.y };
            pushUndo('drag ' + partName);
            rebuildPartsList(); updatePropsPanel(); render();
            return;
        }
    }

    for (let i = order.length - 1; i >= 0; i--) {
        const partName = order[i];
        const pd = state.parts[partName];
        if (!pd || !pd.visible) continue;
        const img = getImageForSlot(partName);
        if (!img) continue;
        const pos = getPartWorldPos(partName);
        const Z = state.zoom;
        const hw = (img.width / 2) * Z;
        const hh = (img.height / 2) * Z;
        if (mx >= pos.x - hw && mx <= pos.x + hw && my >= pos.y - hh && my <= pos.y + hh) {
            state.selectedPart = partName;
            rebuildPartsList(); updatePropsPanel(); render();
            return;
        }
    }
}

function onCanvasMouseMove(e) {
    if (!state.dragging) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
    const my = (e.clientY - rect.top) * (canvas.height / rect.height);
    const d = state.dragging;
    const Z = state.zoom;
    const dx = (mx - d.startMX) / Z;
    const dy = -(my - d.startMY) / Z;
    const pd = state.parts[d.part];
    pd.anchor.x = Math.round(d.startAX + dx);
    pd.anchor.y = Math.round(d.startAY + dy);
    updatePropsPanel(); render();
}

function onCanvasMouseUp() { state.dragging = null; }

// ─── Canvas Rendering ───
function render() {
    const W = canvas.width;
    const H = canvas.height;
    const Z = state.zoom;
    const cx = W / 2;
    const cy = H / 2;

    ctx.clearRect(0, 0, W, H);

    // Checkerboard
    const checkSize = Math.max(8, Z * 2);
    for (let y = 0; y < H; y += checkSize) {
        for (let x = 0; x < W; x += checkSize) {
            ctx.fillStyle = ((x + y) / checkSize) % 2 === 0 ? '#2a2a3e' : '#222238';
            ctx.fillRect(x, y, checkSize, checkSize);
        }
    }

    // Grid overlay
    if (state.showGrid) {
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1;
        for (let x = 0; x < W; x += Z) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
        for (let y = 0; y < H; y += Z) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    }

    // Crosshair
    if (state.showCrosshair) {
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();
        ctx.setLineDash([]);
    }

    if (Object.keys(state.parts).length === 0) return;

    const order = state.drawOrder[state.direction] || [];
    const showBones = $('chk-bones').checked;
    const showAnchors = $('chk-anchors').checked;
    const torsoAnim = state.playing ? getAnimatedTransform('torso') : { rot: 0, y: 0 };

    // Onion skinning - draw previous frame ghosted
    if (state.showOnion && state.playing) {
        const savedFrame = state.animFrame;
        const savedTime = state.animTime;
        const kfs = ANIM_KEYFRAMES[state.animType] || ANIM_KEYFRAMES.walk;
        state.animFrame = (savedFrame - 1 + kfs.length) % kfs.length;
        state.animTime = state.animFrame;
        ctx.globalAlpha = 0.2;
        drawSprites(order, cx, cy, Z);
        ctx.globalAlpha = 1;
        state.animFrame = savedFrame;
        state.animTime = savedTime;
    }

    // Draw sprites
    drawSprites(order, cx, cy, Z);

    // Draw equipment overlays
    drawAllEquipment(order, cx, cy, Z, torsoAnim);

    // Draw bones
    if (showBones) {
        for (const partName of order) {
            const pd = state.parts[partName];
            if (!pd || !pd.visible) continue;
            const parent = BONE_HIERARCHY[partName];
            if (!parent || !state.parts[parent]) continue;
            const childPos = getPartWorldPos(partName);
            const parentPos = getPartWorldPos(parent);
            ctx.beginPath();
            ctx.moveTo(parentPos.x, parentPos.y);
            ctx.lineTo(childPos.x, childPos.y);
            ctx.strokeStyle = PART_COLORS[partName] || '#fff';
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 0.6;
            ctx.stroke();
            ctx.globalAlpha = 1;
        }
    }

    // Draw anchors
    if (showAnchors) {
        for (const partName of order) {
            const pd = state.parts[partName];
            if (!pd || !pd.visible) continue;
            const pos = getPartWorldPos(partName);
            const color = PART_COLORS[partName] || '#fff';
            const isSelected = partName === state.selectedPart;
            const radius = isSelected ? 6 : 4;
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.stroke();
            if (isSelected) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, radius + 3, 0, Math.PI * 2);
                ctx.strokeStyle = color;
                ctx.lineWidth = 1;
                ctx.setLineDash([3, 3]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }
    }
}

function drawSprites(order, cx, cy, Z) {
    const torsoAnim = state.playing ? getAnimatedTransform('torso') : { rot: 0, y: 0 };
    for (const partName of order) {
        const pd = state.parts[partName];
        if (!pd || !pd.visible) continue;
        const img = getImageForSlot(partName);
        if (!img) continue;
        const ax = pd.anchor.x;
        const ay = pd.anchor.y;
        const sx = cx + (ax - 16) * Z;
        const sy = cy - (ay - 16) * Z - (torsoAnim.y || 0) * Z;
        const anim = state.playing ? getAnimatedTransform(partName) : { rot: 0, y: 0 };
        const totalRot = (pd.rotation + (anim.rot || 0)) * Math.PI / 180;
        ctx.save();
        ctx.translate(sx, sy + (anim.y || 0) * Z);
        ctx.rotate(totalRot);
        const w = img.width * Z;
        const h = img.height * Z;
        ctx.drawImage(img, -w / 2, -h / 2, w, h);
        if (partName === state.selectedPart) {
            ctx.strokeStyle = PART_COLORS[partName] || '#fff';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(-w / 2 - 2, -h / 2 - 2, w + 4, h + 4);
            ctx.setLineDash([]);
        }
        ctx.restore();
    }
}

function drawAllEquipment(order, cx, cy, Z, torsoAnim) {
    for (const [slotType, itemId] of Object.entries(state.equipment)) {
        if (!itemId) continue;
        const items = EQUIPMENT_ITEMS[slotType];
        if (!items) continue;
        const item = items.find(i => i.id === itemId);
        if (!item || !item.shape) continue;

        const attachPart = EQUIP_ATTACH[slotType];
        if (!attachPart || !state.parts[attachPart]) continue;
        const pd = state.parts[attachPart];
        if (!pd.visible) continue;

        const offset = state.equipmentOffsets[slotType] || { x: 0, y: 0 };
        const pos = getPartWorldPos(attachPart);
        const anim = state.playing ? getAnimatedTransform(attachPart) : { rot: 0, y: 0 };
        const totalRot = (pd.rotation + (anim.rot || 0)) * Math.PI / 180;

        ctx.save();
        ctx.translate(pos.x + offset.x * Z, pos.y + (anim.y || 0) * Z + offset.y * Z);
        ctx.rotate(totalRot);

        // Glow effect
        if (item.glowColor) {
            ctx.beginPath();
            ctx.arc(0, 0, Z * 3, 0, Math.PI * 2);
            ctx.fillStyle = item.glowColor;
            ctx.globalAlpha = 0.15;
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        ctx.fillStyle = item.color;
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.lineJoin = 'round';

        drawEquipShape(item.shape, Z);

        ctx.restore();

        // For legs/boots/gloves, draw on mirrored part too
        if (slotType === 'legs' && state.parts['right_leg'] && state.parts['right_leg'].visible) {
            drawMirroredEquip(item, 'right_leg', offset, Z);
        }
        if (slotType === 'boots' && state.parts['right_foot'] && state.parts['right_foot'].visible) {
            drawMirroredEquip(item, 'right_foot', offset, Z);
        }
        if (slotType === 'gloves' && state.parts['right_hand'] && state.parts['right_hand'].visible) {
            drawMirroredEquip(item, 'right_hand', offset, Z);
        }
    }
}

function drawMirroredEquip(item, partName, offset, Z) {
    const pd = state.parts[partName];
    if (!pd || !pd.visible) return;
    const pos = getPartWorldPos(partName);
    const anim = state.playing ? getAnimatedTransform(partName) : { rot: 0, y: 0 };
    const totalRot = (pd.rotation + (anim.rot || 0)) * Math.PI / 180;
    ctx.save();
    ctx.translate(pos.x + offset.x * Z, pos.y + (anim.y || 0) * Z + offset.y * Z);
    ctx.rotate(totalRot);
    if (item.glowColor) {
        ctx.beginPath();
        ctx.arc(0, 0, Z * 3, 0, Math.PI * 2);
        ctx.fillStyle = item.glowColor;
        ctx.globalAlpha = 0.15;
        ctx.fill();
        ctx.globalAlpha = 1;
    }
    ctx.fillStyle = item.color;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.lineJoin = 'round';
    drawEquipShape(item.shape, Z);
    ctx.restore();
}

function drawEquipShape(shape, Z) {
    const s = Z;
    switch (shape) {
        case 'sword':
            ctx.fillRect(-s * 0.4, -s * 4, s * 0.8, s * 3.5);
            ctx.strokeRect(-s * 0.4, -s * 4, s * 0.8, s * 3.5);
            ctx.fillStyle = '#6B4226';
            ctx.fillRect(-s * 0.6, -s * 0.5, s * 1.2, s * 1.5);
            ctx.strokeRect(-s * 0.6, -s * 0.5, s * 1.2, s * 1.5);
            ctx.fillStyle = '#7A7A7A';
            ctx.fillRect(-s * 1, -s * 0.5, s * 2, s * 0.4);
            ctx.strokeRect(-s * 1, -s * 0.5, s * 2, s * 0.4);
            break;
        case 'katana':
            ctx.fillRect(-s * 0.3, -s * 5, s * 0.6, s * 4.5);
            ctx.strokeRect(-s * 0.3, -s * 5, s * 0.6, s * 4.5);
            ctx.fillStyle = '#4A3520';
            ctx.fillRect(-s * 0.4, -s * 0.5, s * 0.8, s * 2);
            ctx.strokeRect(-s * 0.4, -s * 0.5, s * 0.8, s * 2);
            break;
        case 'axe':
            ctx.fillRect(-s * 0.3, -s * 3.5, s * 0.6, s * 4);
            ctx.strokeRect(-s * 0.3, -s * 3.5, s * 0.6, s * 4);
            ctx.beginPath();
            ctx.moveTo(-s * 0.3, -s * 3.5);
            ctx.lineTo(-s * 1.5, -s * 2.5);
            ctx.lineTo(-s * 1.5, -s * 1);
            ctx.lineTo(-s * 0.3, -s * 0.5);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            break;
        case 'staff':
            ctx.fillRect(-s * 0.2, -s * 4, s * 0.4, s * 5);
            ctx.strokeRect(-s * 0.2, -s * 4, s * 0.4, s * 5);
            ctx.beginPath();
            ctx.arc(0, -s * 4, s * 0.8, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            break;
        case 'cap':
            ctx.fillRect(-s * 2, -s * 0.8, s * 4, s * 1);
            ctx.strokeRect(-s * 2, -s * 0.8, s * 4, s * 1);
            ctx.fillRect(-s * 1.5, -s * 1.5, s * 3, s * 0.7);
            ctx.strokeRect(-s * 1.5, -s * 1.5, s * 3, s * 0.7);
            break;
        case 'helm':
            ctx.beginPath();
            ctx.arc(0, -s * 0.5, s * 2, Math.PI, 0);
            ctx.fill(); ctx.stroke();
            ctx.fillRect(-s * 2, -s * 0.5, s * 4, s * 0.6);
            ctx.strokeRect(-s * 2, -s * 0.5, s * 4, s * 0.6);
            break;
        case 'crown':
            ctx.fillRect(-s * 1.8, -s * 0.5, s * 3.6, s * 0.8);
            ctx.strokeRect(-s * 1.8, -s * 0.5, s * 3.6, s * 0.8);
            for (let i = -1; i <= 1; i++) {
                ctx.beginPath();
                ctx.moveTo(i * s * 1.2 - s * 0.3, -s * 0.5);
                ctx.lineTo(i * s * 1.2, -s * 1.8);
                ctx.lineTo(i * s * 1.2 + s * 0.3, -s * 0.5);
                ctx.fill(); ctx.stroke();
            }
            break;
        case 'tunic':
            ctx.globalAlpha = 0.5;
            ctx.fillRect(-s * 2, -s * 1.5, s * 4, s * 3);
            ctx.strokeRect(-s * 2, -s * 1.5, s * 4, s * 3);
            ctx.globalAlpha = 1;
            break;
        case 'chainmail':
            ctx.globalAlpha = 0.5;
            ctx.fillRect(-s * 2, -s * 1.5, s * 4, s * 3);
            ctx.strokeRect(-s * 2, -s * 1.5, s * 4, s * 3);
            // Chain pattern
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 0.5;
            for (let r = -1; r < 2; r++) {
                for (let c = -1; c < 2; c++) {
                    ctx.beginPath();
                    ctx.arc(c * s * 1.2, r * s * 0.8, s * 0.3, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1.5;
            ctx.globalAlpha = 1;
            break;
        case 'plate':
            ctx.globalAlpha = 0.6;
            ctx.fillRect(-s * 2.2, -s * 1.8, s * 4.4, s * 3.6);
            ctx.strokeRect(-s * 2.2, -s * 1.8, s * 4.4, s * 3.6);
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.15;
            ctx.fillRect(-s * 1.5, -s * 1.2, s * 1, s * 2);
            ctx.globalAlpha = 1;
            break;
        case 'pants':
            ctx.globalAlpha = 0.5;
            ctx.fillRect(-s * 1, -s * 1, s * 2, s * 2.5);
            ctx.strokeRect(-s * 1, -s * 1, s * 2, s * 2.5);
            ctx.globalAlpha = 1;
            break;
        case 'greaves':
            ctx.globalAlpha = 0.6;
            ctx.fillRect(-s * 1.2, -s * 1.2, s * 2.4, s * 2.8);
            ctx.strokeRect(-s * 1.2, -s * 1.2, s * 2.4, s * 2.8);
            ctx.globalAlpha = 1;
            break;
        case 'boots_eq':
            ctx.globalAlpha = 0.6;
            ctx.fillRect(-s * 1, -s * 0.5, s * 2, s * 1.5);
            ctx.strokeRect(-s * 1, -s * 0.5, s * 2, s * 1.5);
            ctx.globalAlpha = 1;
            break;
        case 'sabatons':
            ctx.globalAlpha = 0.7;
            ctx.fillRect(-s * 1.2, -s * 0.6, s * 2.4, s * 1.8);
            ctx.strokeRect(-s * 1.2, -s * 0.6, s * 2.4, s * 1.8);
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.1;
            ctx.fillRect(-s * 0.8, -s * 0.3, s * 0.5, s * 0.5);
            ctx.globalAlpha = 1;
            break;
        case 'gloves_eq':
            ctx.globalAlpha = 0.6;
            ctx.fillRect(-s * 0.8, -s * 0.8, s * 1.6, s * 1.2);
            ctx.strokeRect(-s * 0.8, -s * 0.8, s * 1.6, s * 1.2);
            ctx.globalAlpha = 1;
            break;
        case 'gauntlets':
            ctx.globalAlpha = 0.7;
            ctx.fillRect(-s * 1, -s * 1, s * 2, s * 1.5);
            ctx.strokeRect(-s * 1, -s * 1, s * 2, s * 1.5);
            ctx.fillStyle = '#fff';
            ctx.globalAlpha = 0.1;
            ctx.fillRect(-s * 0.5, -s * 0.6, s * 0.3, s * 0.3);
            ctx.globalAlpha = 1;
            break;
    }
}

// ─── Kick off ───
init();
</script>
