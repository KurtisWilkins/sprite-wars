<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Sprite Wars</title>
    <script>
        // Try to lock to landscape on mobile devices
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
        }
    </script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <img src="../Sprites/Images/Logo.png" alt="Sprite Wars" class="logo" id="logo-img">
            <h1 class="game-title">Sprite Wars</h1>
            <p class="login-subtitle">Legends of the Shattered Grid</p>
            <div id="login-form" class="auth-form">
                <input type="text" id="username-input" placeholder="Enter thy name..." autocomplete="username">
                <input type="password" id="password-input" placeholder="Secret word..." autocomplete="current-password">
                <button id="login-btn" class="btn btn-primary">Enter the Realm</button>
                <button id="register-btn" class="btn btn-secondary">Create Account</button>
                <button id="guest-btn" class="btn btn-tertiary">Play as Guest</button>
                <a href="tile-admin.html" class="btn btn-tertiary" style="margin-top:8px">Tile Admin</a>
                <a href="sprite-editor.html" class="btn btn-tertiary" style="margin-top:4px">Sprite Editor</a>
            </div>
            <div id="register-form" class="auth-form hidden">
                <input type="text" id="reg-username" placeholder="Choose thy name..." autocomplete="username">
                <input type="email" id="reg-email" placeholder="Scroll address (optional)">
                <input type="password" id="reg-password" placeholder="Secret word..." autocomplete="new-password">
                <input type="password" id="reg-confirm" placeholder="Confirm secret word..." autocomplete="new-password">
                <button id="do-register-btn" class="btn btn-primary">Join the Adventure</button>
                <button id="back-login-btn" class="btn btn-secondary">Back to Login</button>
            </div>
            <p class="version-text">v0.1.0 Web</p>
        </div>
    </div>

    <!-- Game Canvas Container -->
    <div id="game-container" class="screen">
        <canvas id="game-canvas"></canvas>

        <!-- UI Overlay Layer -->
        <div id="ui-overlay">
            <!-- Top HUD -->
            <div id="top-hud" class="hud-bar hidden">
                <div class="hud-left">
                    <span id="player-name" class="hud-text"></span>
                    <span id="player-level" class="hud-text"></span>
                </div>
                <div class="hud-center">
                    <button id="hud-sprites-btn" class="hud-action-btn" title="Sprites (I)">
                        <span class="hud-action-icon">🐾</span>
                        <span class="hud-action-label">Sprites</span>
                    </button>
                    <button id="hud-bag-btn" class="hud-action-btn" title="Bag (B)">
                        <span class="hud-action-icon">🎒</span>
                        <span class="hud-action-label">Bag</span>
                    </button>
                    <button id="hud-admin-btn" class="hud-action-btn hud-admin-only hidden" title="Admin Log (`)">
                        <span class="hud-action-icon">📋</span>
                        <span class="hud-action-label">Log</span>
                    </button>
                </div>
                <div class="hud-right">
                    <span id="gold-display" class="hud-text">0g</span>
                    <button id="menu-btn" class="hud-btn">☰</button>
                </div>
            </div>

            <!-- Admin Log Panel -->
            <div id="admin-log-panel" class="hidden">
                <div class="admin-log-header">
                    <span class="admin-log-title">Admin Log</span>
                    <div class="admin-log-controls">
                        <button id="admin-log-clear" class="admin-log-btn">Clear</button>
                        <button id="admin-log-close" class="admin-log-btn">✕</button>
                    </div>
                </div>
                <div id="admin-log-content"></div>
            </div>

            <!-- Notification Area -->
            <div id="notification-area"></div>

            <!-- Dialogue Box -->
            <div id="dialogue-box" class="hidden">
                <div id="dialogue-speaker"></div>
                <div id="dialogue-text"></div>
                <div id="dialogue-choices"></div>
                <div id="dialogue-advance">▼</div>
            </div>

            <!-- Battle UI -->
            <div id="battle-hud" class="hidden">
                <div id="turn-order-bar"></div>
                <div id="battle-info-panel"></div>
                <div id="ability-bar"></div>
                <div id="battle-log"></div>
            </div>

            <!-- Mobile Controls -->
            <div id="mobile-controls" class="hidden">
                <div id="virtual-dpad">
                    <button class="dpad-btn dpad-up" data-dir="up">&#9650;</button>
                    <button class="dpad-btn dpad-left" data-dir="left">&#9664;</button>
                    <button class="dpad-btn dpad-center"></button>
                    <button class="dpad-btn dpad-right" data-dir="right">&#9654;</button>
                    <button class="dpad-btn dpad-down" data-dir="down">&#9660;</button>
                </div>
                <div id="mobile-action-buttons">
                    <button id="mobile-interact-btn" class="mobile-action-btn">A</button>
                </div>
            </div>

            <!-- Screen Panels (menus, inventory, etc.) -->
            <div id="screen-panel" class="hidden"></div>
        </div>

        <!-- Transition Overlay -->
        <div id="transition-overlay" class="hidden"></div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="hidden">
            <div class="loading-spinner"></div>
            <div id="loading-text">Loading...</div>
            <div id="loading-bar-container">
                <div id="loading-bar"></div>
            </div>
        </div>
    </div>

    <!-- Scripts - ES Modules -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
