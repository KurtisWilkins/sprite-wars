# Netlify deployment configuration
# Deploy by pointing Netlify to the repo root and setting publish to "."

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/Web/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/Sprites/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/Audio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[redirects]]
  from = "/"
  to = "/Web/index.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/Web/index.html"
  status = 200
